<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<title>お通し・小鉢帳</title>
<style>
:root{
  --ice:#E6EBED;
  --ice-2:#F2F5F6;
  --ink:#0E212B;
  --ai:#1F4E5F;
  --ai-2:#2E6E82;
  --gin:#6F7E85;
  --gin-2:#9AA8AD;
  --chiai:#A8342B;
  --kombu:#6B7A3C;
  --line:rgba(14,33,43,.14);
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  --sans:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--ice);color-scheme:light only;-webkit-text-size-adjust:100%}
body{
  background:var(--ice);min-height:100vh;color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}

header{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#F4F7F8,var(--ice));position:relative;z-index:40}
.head-in{max-width:1080px;margin:0 auto;padding:14px 20px 0}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{font-family:var(--serif);font-size:26px;font-weight:600;margin:0;letter-spacing:.16em}
.brand .sub{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--gin);text-transform:uppercase}
.brand .count{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ai);margin-left:auto}
.brand .price{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--gin);width:100%;margin-top:2px}

.controls{display:flex;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 220px;min-width:180px;padding:9px 14px;border:1px solid var(--line);background:#fff;border-radius:2px;font-family:var(--sans);font-size:14px;color:var(--ink)}
.search::placeholder{color:var(--gin-2)}
.search:focus{outline:2px solid var(--ai-2);outline-offset:1px}
.shuffle{appearance:none;border:1px solid var(--line);background:#fff;cursor:pointer;font-family:var(--sans);font-size:13px;color:var(--ai);padding:9px 16px;border-radius:2px;letter-spacing:.04em;white-space:nowrap}
.shuffle:hover{background:var(--ice-2);border-color:var(--ai-2)}

.frow{padding:12px 0 0}
.frow .flabel{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--gin-2);margin-bottom:5px}
.filters{display:flex;flex-wrap:wrap;gap:5px}
.filters.mb{padding-bottom:14px}
.f-btn{appearance:none;cursor:pointer;font-family:var(--sans);font-size:12.5px;padding:5px 13px;border:1px solid var(--line);background:transparent;color:var(--gin);border-radius:99px;letter-spacing:.02em;display:flex;align-items:center;gap:5px}
.f-btn .n{font-family:var(--mono);font-size:10px;color:var(--gin-2)}
.f-btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ice-2)}
.f-btn[aria-pressed="true"] .n{color:var(--gin-2)}
.f-btn:focus-visible{outline:2px solid var(--ai-2);outline-offset:2px}

main{max-width:1080px;margin:0 auto;padding:18px 20px 90px}

.spotlight{background:#fff;border:1px solid var(--line);border-left:3px solid var(--kombu);padding:20px 22px;margin-bottom:26px;position:relative}
.spotlight .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--gin);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.spotlight .genre{font-size:11px;color:var(--kombu)}
.spotlight .st-title{font-family:var(--serif);font-size:19px;font-weight:600;margin:0 0 4px;letter-spacing:.03em;line-height:1.4}
.spotlight .st-cost{font-family:var(--mono);font-size:11px;color:var(--ai);margin-bottom:10px}
.spotlight .st-body{font-size:14px;margin:0;color:#12333f}
.spotlight .st-again{margin-top:14px;appearance:none;border:1px solid var(--line);background:transparent;cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--ai);padding:5px 12px;border-radius:2px;letter-spacing:.08em}
.spotlight .st-again:hover{background:var(--ice-2)}

.grp-head{font-family:var(--serif);font-size:18px;letter-spacing:.08em;font-weight:600;margin:26px 0 4px;padding-bottom:8px;border-bottom:2px solid var(--ink);display:flex;align-items:baseline;gap:10px}
.grp-head:first-of-type{margin-top:6px}
.grp-head .gn{font-family:var(--mono);font-size:11px;color:var(--gin-2);font-weight:400}

.tlist{display:grid;grid-template-columns:1fr 1fr;gap:0 34px}
@media(max-width:820px){.tlist{grid-template-columns:1fr}}
.tcard{break-inside:avoid;border-top:1px solid var(--line);padding:16px 0 18px}
.tcard .th{display:flex;gap:10px;align-items:baseline;margin-bottom:8px;flex-wrap:wrap}
.tcard .tnum{font-family:var(--mono);font-size:10px;color:var(--gin-2);flex:0 0 auto;padding-top:3px}
.tcard .tt{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.03em;line-height:1.45;margin:0;flex:1 1 auto}
.tcard .cost{font-family:var(--mono);font-size:10px;letter-spacing:.02em;color:var(--ai);white-space:nowrap;padding-top:3px}
.tcard .cost b{color:var(--ink);font-size:12px}
.tcard .cost.hi{color:var(--chiai)}

.blk{margin:0 0 8px}
.blk .bl{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--gin-2);margin-bottom:3px}
.blk ul{margin:0;padding:0;list-style:none}
.blk.mat li{font-size:13px;line-height:1.6;padding-left:12px;position:relative;color:#12333f}
.blk.mat li::before{content:"・";position:absolute;left:0;color:var(--gin-2)}
.blk.mat li .g10{color:var(--gin);font-size:11px}
.blk.step li{font-size:13.5px;line-height:1.62;padding-left:20px;position:relative;color:#12333f;margin-bottom:1px}
.blk.step li .sn{position:absolute;left:0;font-family:var(--mono);font-size:10px;color:var(--ai-2);top:3px}
.blk.step li.note{padding-left:12px;color:var(--gin);font-size:12px}
.blk.step li.note::before{content:"※";position:absolute;left:0;color:var(--kombu)}
.tcard mark{background:rgba(107,122,60,.2);color:var(--kombu);padding:0 2px;border-radius:2px}

.empty{text-align:center;color:var(--gin);font-size:14px;padding:60px 20px}
.empty .big{font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:8px}

footer{max-width:1080px;margin:0 auto;padding:0 20px 60px;color:var(--gin);font-size:12px;line-height:1.9}
footer hr{border:0;border-top:1px solid var(--line);margin:0 0 16px}

@media(max-width:600px){.brand h1{font-size:22px}.brand .count{width:100%;margin-left:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.back-wcsa{position:fixed;top:12px;right:14px;z-index:60;appearance:none;cursor:pointer;font-family:var(--sans);font-size:12.5px;color:var(--ai);background:rgba(255,255,255,.92);border:1px solid var(--line);padding:7px 14px;border-radius:99px;letter-spacing:.04em;backdrop-filter:blur(6px);box-shadow:0 1px 6px rgba(14,33,43,.10);display:flex;align-items:center;gap:5px}
.back-wcsa:hover{background:#fff;border-color:var(--ai-2)}
.back-wcsa:active{transform:scale(.96)}
@media(max-width:600px){.back-wcsa{top:10px;right:10px;font-size:12px;padding:6px 12px}}
</style>
</head>
<body>

<button class="back-wcsa" id="backWcsa" type="button">‹ WCSAに戻る</button>

<header>
  <div class="head-in">
    <div class="brand">
      <h1>お通し・小鉢帳</h1>
      <span class="sub">otoshi &amp; kobachi</span>
      <span class="count" id="count"></span>
      <span class="price">売価 ¥480 ／ 原価上限35%＝¥168 ／ 材料は 1人前 →(10人前)</span>
    </div>
    <div class="controls">
      <input class="search" id="q" type="search" placeholder="キーワードで探す（例：大根、鰤、白和え、揚げ）" aria-label="小鉢を検索">
      <button class="shuffle" id="shuffle" type="button">🎲 ランダム</button>
    </div>
    <div class="frow"><div class="flabel">MONTH ／ 月</div><div class="filters" id="mfilters"></div></div>
    <div class="frow"><div class="flabel">CATEGORY ／ 分類</div><div class="filters mb" id="gfilters"></div></div>
  </div>
</header>

<main>
  <section class="spotlight" id="spotlight" hidden>
    <div class="eyebrow"><span>今日のひと品</span><span class="genre" id="sp-genre"></span></div>
    <h3 class="st-title" id="sp-title"></h3>
    <div class="st-cost" id="sp-cost"></div>
    <p class="st-body" id="sp-body"></p>
    <button class="st-again" id="sp-again" type="button">別の一品を見る</button>
  </section>
  <div id="list"></div>
</main>

<footer>
  <hr>
  原価は一般相場での仕入れ単価による試算。基本調味料（醤油・砂糖・塩・酢・油）は少量使いを概算計上。<br>
  仕入れ値・季節・産地で最適は変わります。目玉枠（いくら・白子・帆立等）は相場高騰時に差し替え前提で。
</footer>

<script>

   2〜12月はこの配列に追記すれば月ボタンが自動で増えます。 */

T.forEach((x,i)=>x.no=i+1);

const $=s=>document.querySelector(s);
const listEl=$('#list'),countEl=$('#count');
let curMonth=null, curGenre='all', kw='';

function monthsInData(){
  const s=new Set(T.map(x=>x.m));
  return [...s].sort((a,b)=>a-b);
}

function drawMonthFilters(){
  const box=$('#mfilters');
  const months=monthsInData();
  const cnt={};T.forEach(x=>cnt[x.m]=(cnt[x.m]||0)+1);
  if(curMonth===null)curMonth=months[0];
  let html='';
  months.forEach(m=>{
    html+=`<button class="f-btn" data-m="${m}" aria-pressed="${m===curMonth}">${m}月<span class="n">${cnt[m]}</span></button>`;
  });
  box.innerHTML=html;
  box.querySelectorAll('.f-btn').forEach(b=>b.onclick=()=>{
    curMonth=+b.dataset.m;
    box.querySelectorAll('.f-btn').forEach(x=>x.setAttribute('aria-pressed',x===b));
    drawGenreFilters();draw();
  });
}

function drawGenreFilters(){
  const box=$('#gfilters');
  const inMonth=T.filter(x=>x.m===curMonth);
  const cnt={};inMonth.forEach(x=>cnt[x.g]=(cnt[x.g]||0)+1);
  let html=`<button class="f-btn" data-g="all" aria-pressed="${curGenre==='all'}">すべて<span class="n">${inMonth.length}</span></button>`;
  G_ORDER.forEach(g=>{if(cnt[g])html+=`<button class="f-btn" data-g="${g}" aria-pressed="${curGenre===g}">${GENRES[g].label}<span class="n">${cnt[g]}</span></button>`;});
  box.innerHTML=html;
  box.querySelectorAll('.f-btn').forEach(b=>b.onclick=()=>{
    curGenre=b.dataset.g;
    box.querySelectorAll('.f-btn').forEach(x=>x.setAttribute('aria-pressed',x===b));
    draw();
  });
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hl(text){
  if(!kw)return esc(text);
  const re=new RegExp('('+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return esc(text).replace(re,'<mark>$1</mark>');
}
function matHTML(m){
  return m.split('→').map((p,i)=>i===0?hl(p.trim()):`<span class="g10">→${hl(p.trim())}</span>`).join(' ');
}

function draw(){
  let hit=T.filter(x=>x.m===curMonth&&(curGenre==='all'||x.g===curGenre)&&
    (!kw||x.t.includes(kw)||x.mat.some(mm=>mm.includes(kw))||x.step.some(ss=>ss.includes(kw))));
  countEl.textContent=hit.length+'品（'+curMonth+'月）';
  if(!hit.length){
    listEl.innerHTML=`<div class="empty"><div class="big">見つかりませんでした</div>キーワードを変えるか、分類を「すべて」に戻してください。</div>`;
    return;
  }
  hit.sort((a,b)=>G_ORDER.indexOf(a.g)-G_ORDER.indexOf(b.g)||a.no-b.no);
  let html='',lastG='';
  hit.forEach(x=>{
    if(x.g!==lastG){
      if(lastG!=='')html+='</div>';
      const gc=hit.filter(y=>y.g===x.g).length;
      html+=`<div class="grp-head">${GENRES[x.g].label}<span class="gn">${gc}品</span></div><div class="tlist">`;
      lastG=x.g;
    }
    const hi=x.rate>=20?' hi':'';
    const matLi=x.mat.map(mm=>`<li>${matHTML(mm)}</li>`).join('');
    let sn=0;
    const stepLi=x.step.map(ss=>{
      if(ss.startsWith('※'))return `<li class="note">${hl(ss.slice(1))}</li>`;
      sn++;return `<li><span class="sn">${sn}</span>${hl(ss)}</li>`;
    }).join('');
    html+=`<div class="tcard">
      <div class="th"><span class="tnum">${String(x.no).padStart(3,'0')}</span><h4 class="tt">${hl(x.t)}</h4><span class="cost${hi}">原価<b>¥${x.cost}</b> ／ ${x.rate}%</span></div>
      <div class="blk mat"><div class="bl">材料 1人前 →(10人前)</div><ul>${matLi}</ul></div>
      <div class="blk step"><div class="bl">作り方</div><ul>${stepLi}</ul></div>
    </div>`;
  });
  html+='</div>';
  listEl.innerHTML=html;
}

function spotlight(){
  const x=T[Math.floor(Math.random()*T.length)];
  $('#spotlight').hidden=false;
  $('#sp-genre').textContent=x.m+'月 ／ '+GENRES[x.g].label;
  $('#sp-title').textContent=x.t;
  $('#sp-cost').textContent=`原価 ¥${x.cost} ／ 原価率 ${x.rate}%`;
  $('#sp-body').textContent=x.step.filter(s=>!s.startsWith('※'))[0]||'';
}

$('#q').addEventListener('input',e=>{kw=e.target.value.trim();draw();});
$('#shuffle').onclick=()=>{spotlight();window.scrollTo({top:0,behavior:'smooth'});};
$('#sp-again').onclick=spotlight;

drawMonthFilters();
drawGenreFilters();
draw();
spotlight();

document.getElementById('backWcsa').onclick=function(){
  try{if(window.parent&&window.parent!==window&&window.parent.switchMode){window.parent.switchMode('shift');return;}}catch(e){}
  if(history.length>1){history.back();}else{location.href='index.html';}
};
