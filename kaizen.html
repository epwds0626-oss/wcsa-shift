<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<title>改善の記録</title>
<!--
  改善の記録（スタッフ向け）【追加 R8.11.27】
  店長日報（nippo.html）の改善提案を、本店・マルコ両方まとめて「その後どうなったか」で見せるページ。
  ・パスワードなしで誰でも見られる。売上・人件費などの数字は一切表示しない（日報の snap は読まない）。
  ・表示だけ。状態や結果の更新は、店長日報の「これまでの提案、その後どうなった？」で行う。
  ・データ：nippo/{enya|marco}/{YYYYMMDD}/proposals[]（title, problem, cause, idea, effect, who, status, decisionNote, result, resultAt, needDecision）
-->
<style>
:root{
  --bg:#eef1f3; --surface:#fff; --surface2:#f4f5f8; --surface3:#e7e9ef;
  --border:#d7dae2; --text:#1a1c22; --text2:#5b6070; --text3:#8c92a4;
  --enya:#b07d00; --marco:#1a7fbf;
  --s-new:#7a5af5;  --s-new-bg:#efeafe;     /* 提案（判断待ち） */
  --s-try:#1a7fbf;  --s-try-bg:#e4f1fa;     /* 採用・試行中 */
  --s-ok:#0a7d4f;   --s-ok-bg:#e3f4ec;      /* 効果あり（定着） */
  --s-ng:#c2410c;   --s-ng-bg:#fdeee5;      /* 効果なし（やめる） */
  --s-hold:#6b7280; --s-hold-bg:#eef0f3;    /* 保留 */
  --s-skip:#9aa0ad; --s-skip-bg:#f3f4f6;    /* 見送り */
  --shadow:0 1px 3px rgba(20,25,40,.06),0 4px 16px rgba(20,25,40,.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit;font-size:14px}
#app{display:flex;flex-direction:column;height:100%}
.mhead{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:0 1px 6px rgba(20,25,40,.05)}
.row{display:flex;align-items:center;gap:8px;padding:9px 12px;flex-wrap:wrap}
.title{font-size:15px;font-weight:800;white-space:nowrap}
.spacer{flex:1}
.hbtn{border:1px solid var(--border);background:var(--surface2);color:var(--text2);height:34px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.seg{display:flex;background:var(--surface3);border-radius:10px;padding:3px;gap:2px;flex-shrink:0}
.seg button{border:none;background:transparent;color:var(--text2);font-size:13px;font-weight:700;padding:7px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 60px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.card h2{font-size:15px;font-weight:800;margin-bottom:4px}
.lead{font-size:12.5px;color:var(--text2);margin-bottom:10px}
.note{font-size:12px;color:var(--text2)}

/* 見出しの一言 */
.hero{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hero .big{font-size:34px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.hero .big small{font-size:14px;font-weight:800;margin-left:2px}
.hero .msg{flex:1;min-width:220px;font-size:14px}
.hero .msg b{color:var(--s-ok)}

/* 流れ（提案→採用→効果あり） */
.flowbar{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:stretch;margin-top:12px}
.fstep{border-radius:12px;padding:10px 8px;text-align:center;border:1.5px solid transparent}
.fstep .n{font-size:26px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.fstep .l{font-size:12px;font-weight:800}
.fstep .s{font-size:11px;color:var(--text2)}
.fstep.a{background:var(--s-new-bg);color:var(--s-new)}
.fstep.b{background:var(--s-try-bg);color:var(--s-try)}
.fstep.c{background:var(--s-ok-bg);color:var(--s-ok)}
.farw{display:flex;align-items:center;color:var(--text3);font-weight:900;font-size:18px}
@media(max-width:480px){.fstep .n{font-size:22px}.fstep{padding:8px 4px}}

/* 状態の内訳バー */
.sbar{display:flex;height:16px;border-radius:8px;overflow:hidden;margin-top:14px;background:var(--surface3)}
.sbar i{display:block;min-width:0}

/* 状態タイル（押すと絞り込み） */
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
@media(max-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{border:1.5px solid var(--border);background:var(--surface);border-radius:11px;padding:7px 6px;text-align:center;cursor:pointer}
.tile .n{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .l{font-size:11px;font-weight:800;white-space:nowrap}
.tile.on{outline:3px solid var(--c);outline-offset:-1px}
.tile .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:3px;vertical-align:1px}

/* 絞り込み */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:160px;border:1px solid var(--border);border-radius:9px;padding:8px 10px;background:#fff}
.search:focus{outline:2px solid rgba(26,127,191,.2);border-color:var(--marco)}

/* 提案カード */
.sec-t{font-size:13px;font-weight:900;color:var(--text2);margin:6px 2px -4px;display:flex;align-items:center;gap:6px}
.pc{background:var(--surface);border:1px solid var(--border);border-left:6px solid var(--c);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;cursor:pointer}
.pc .top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--text2)}
.pc .ttl{font-size:16px;font-weight:900;margin:4px 0 2px;line-height:1.4}
.shop{font-size:11px;font-weight:800;color:#fff;border-radius:6px;padding:1px 7px}
.shop.enya{background:var(--enya)} .shop.marco{background:var(--marco)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;color:var(--c);background:var(--cb)}
.warn{font-size:11.5px;font-weight:800;color:#b26a00;background:#fff3e0;border-radius:6px;padding:1px 7px}
/* 進み具合（3段階） */
.track{display:flex;align-items:flex-start;margin:10px 0 4px}
.track .st{display:flex;flex-direction:column;align-items:center;gap:2px;flex:0 0 auto;width:64px}
.track .st .d{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface3);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff}
.track .st .t{font-size:10.5px;font-weight:800;color:var(--text3);white-space:nowrap}
.track .st.done .d{background:var(--c);border-color:var(--c)}
.track .st.done .t{color:var(--text)}
.track .st.now .d{box-shadow:0 0 0 4px var(--cb)}
.track .ln{flex:1;height:3px;background:var(--surface3);border-radius:2px;margin:10px -14px 0}
.track .ln.done{background:var(--c)}
.pc .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px;margin-top:8px}
.pc .kv dt{color:var(--text2);font-weight:800;white-space:nowrap}
.pc .kv dd{min-width:0;word-break:break-word}
.pc .res{margin-top:8px;border-radius:9px;padding:8px 10px;background:var(--cb);font-size:13px}
.pc .res b{color:var(--c)}
.pc .more{display:none}
.pc.open .more{display:contents}
.pc .tap{font-size:11px;color:var(--text3);margin-top:6px;text-align:right}
.pc.open .tap{display:none}
.empty{text-align:center;color:var(--text2);padding:24px 8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div class="mhead">
    <div class="row">
      <button class="hbtn" type="button" onclick="goHome()" aria-label="WCSAに戻る">🏠</button>
      <span class="title">📈 改善の記録</span>
      <span class="spacer"></span>
      <div class="seg" id="shopSeg">
        <button data-shop="all" type="button" onclick="setShop('all')">両店</button>
        <button data-shop="enya" type="button" onclick="setShop('enya')">本店</button>
        <button data-shop="marco" type="button" onclick="setShop('marco')">マルコ</button>
      </div>
    </div>
  </div>
  <div class="body"><div class="wrap" id="main"><div class="card"><div class="note">読み込み中…</div></div></div></div>
</div>

<script>
var firebaseConfig={apiKey:"AIzaSyA3YVQwyAudMEZJs_rfEW8IHfxh4Grvlbw",authDomain:"wcsa-shift.firebaseapp.com",databaseURL:"https://wcsa-shift-default-rtdb.firebaseio.com",projectId:"wcsa-shift",storageBucket:"wcsa-shift.firebasestorage.app",messagingSenderId:"521554404721",appId:"1:521554404721:web:f59a570dd7e10f3aed82d0"};
var db=null;
try{ if(!firebase.apps.length)firebase.initializeApp(firebaseConfig); db=firebase.database(); }catch(e){ db=null; }

var SHOPNAME={enya:'本店',marco:'マルコ'};
var DOW='日月火水木金土';
// 状態の並び・色・説明。stage：1=提案 2=試す 3=結果
var ST={
  '提案':            {key:'new', lb:'判断待ち', icon:'💡', c:'var(--s-new)', cb:'var(--s-new-bg)', stage:1},
  '採用・試行中':    {key:'try', lb:'試している', icon:'🔄', c:'var(--s-try)', cb:'var(--s-try-bg)', stage:2},
  '効果あり（定着）':{key:'ok',  lb:'効果あり', icon:'🎉', c:'var(--s-ok)',  cb:'var(--s-ok-bg)',  stage:3},
  '効果なし（やめる）':{key:'ng',lb:'効果なし', icon:'🔁', c:'var(--s-ng)',  cb:'var(--s-ng-bg)',  stage:3},
  '保留':            {key:'hold',lb:'保留',     icon:'⏸', c:'var(--s-hold)',cb:'var(--s-hold-bg)',stage:1},
  '見送り':          {key:'skip',lb:'見送り',   icon:'🙏', c:'var(--s-skip)',cb:'var(--s-skip-bg)',stage:1}
};
var ORDER=['採用・試行中','提案','効果あり（定着）','効果なし（やめる）','保留','見送り'];
var STALE_DAYS=14;   // 試して14日たっても結果が書かれていなければ「結果を書いてください」を出す

var state={shop:'all', status:null, q:'', items:[], loaded:false};

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function goHome(){try{if(window.parent&&window.parent!==window&&typeof window.parent.switchMode==='function'){window.parent.switchMode('shift');return}}catch(e){}location.href='./'}
function segActive(id,attr,val){document.querySelectorAll('#'+id+' button').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-'+attr)===val)})}
function k2date(k){return new Date(+k.slice(0,4),+k.slice(4,6)-1,+k.slice(6,8))}
function dLabel(k){var d=k2date(k);return (d.getMonth()+1)+'/'+d.getDate()+'（'+DOW[d.getDay()]+'）'}
function tLabel(t){var d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()}
function daysSince(k){var d=k2date(k),t=new Date();t.setHours(0,0,0,0);return Math.round((t-d)/864e5)}
function stOf(p){return ST[p.status]?p.status:'提案'}

// ===== 読み込み（両店の日報から改善提案だけ取り出す。数字は使わない） =====
function fetchShop(sh){
  if(!db)return Promise.resolve({});
  return db.ref('nippo/'+sh).orderByKey().limitToLast(400).once('value').then(function(s){return s.val()||{}}).catch(function(){return {}});
}
async function boot(){
  var q=new URLSearchParams(location.search);var s=q.get('shop');
  if(s==='enya'||s==='marco')state.shop=s;
  segActive('shopSeg','shop',state.shop);
  if(!db){$('main').innerHTML='<div class="card empty">通信できません。電波を確認してください。</div>';return}
  var res=await Promise.all([fetchShop('enya'),fetchShop('marco')]);
  var items=[];
  [['enya',res[0]],['marco',res[1]]].forEach(function(x){
    var sh=x[0],all=x[1];
    Object.keys(all).forEach(function(k){
      if(!/^\d{8}$/.test(k))return;
      var r=all[k]||{},ps=r.proposals;if(!ps)return;
      (Array.isArray(ps)?ps:Object.values(ps)).forEach(function(p,i){
        if(!p||!p.title)return;
        items.push({shop:sh,k:k,i:i,author:r.author||'',p:p,st:stOf(p)});
      });
    });
  });
  items.sort(function(a,b){return a.k<b.k?1:a.k>b.k?-1:a.i-b.i});
  state.items=items;state.loaded=true;
  render();
}
function setShop(s){state.shop=s;segActive('shopSeg','shop',s);render()}
function setStatus(s){state.status=state.status===s?null:s;render()}
function toggle(el){el.classList.toggle('open')}

// ===== 描画 =====
function render(){
  var base=state.items.filter(function(x){return state.shop==='all'||x.shop===state.shop});
  var cnt={};ORDER.forEach(function(s){cnt[s]=0});base.forEach(function(x){cnt[x.st]++});
  var total=base.length;
  var adopted=cnt['採用・試行中']+cnt['効果あり（定着）']+cnt['効果なし（やめる）'];
  var judged=cnt['効果あり（定着）']+cnt['効果なし（やめる）'];
  var h='';

  // ① まとめ
  h+='<div class="card">';
  h+='<div class="hero"><div class="big">'+total+'<small>件</small></div><div class="msg">'+
     (state.shop==='all'?'本店・マルコ':SHOPNAME[state.shop])+'の店長から出た改善提案です。<br>'+
     (cnt['効果あり（定着）']?'そのうち <b>'+cnt['効果あり（定着）']+'件が効果ありで、店のやり方になりました。</b>':
      cnt['採用・試行中']?'いま <b style="color:var(--s-try)">'+cnt['採用・試行中']+'件を試しています。</b>結果が出たらここに表示されます。':'まずは一つ、試すところから始めましょう。')+
     '</div></div>';
  // 流れ：出た → 試した → 効いた
  h+='<div class="flowbar">'+
     '<div class="fstep a"><div class="l">① 提案が出た</div><div class="n">'+total+'</div><div class="s">件</div></div><div class="farw">›</div>'+
     '<div class="fstep b"><div class="l">② 試した</div><div class="n">'+adopted+'</div><div class="s">'+(total?Math.round(adopted/total*100)+'%':'—')+'</div></div><div class="farw">›</div>'+
     '<div class="fstep c"><div class="l">③ 効果あり</div><div class="n">'+cnt['効果あり（定着）']+'</div><div class="s">'+(judged?'結果が出た'+judged+'件中':'まだ結果なし')+'</div></div>'+
     '</div>';
  // 内訳バー
  if(total){
    h+='<div class="sbar" role="img" aria-label="状態の内訳">'+ORDER.map(function(s){return cnt[s]?'<i style="flex:'+cnt[s]+' 0 0;background:'+ST[s].c+'" title="'+esc(ST[s].lb)+' '+cnt[s]+'件"></i>':''}).join('')+'</div>';
  }
  // タイル（押すと絞り込み）
  h+='<div class="tiles">'+ORDER.map(function(s){var S=ST[s];
      return '<div class="tile'+(state.status===s?' on':'')+'" style="--c:'+S.c+'" onclick="setStatus(\''+s+'\')" role="button" aria-pressed="'+(state.status===s)+'"><div class="n" style="color:'+S.c+'">'+cnt[s]+'</div><div class="l"><span class="dot"></span>'+esc(S.lb)+'</div></div>'}).join('')+'</div>';
  h+='<div class="note" style="margin-top:8px">四角を押すと、その状態の提案だけ表示します。もう一度押すと元に戻ります。</div>';
  h+='</div>';

  // ② 絞り込み
  h+='<div class="filters"><input class="search" id="q" type="search" placeholder="🔍 ことばで探す（例：提供、あいさつ、グラス）" value="'+esc(state.q)+'" oninput="state.q=this.value;renderList()"></div>';
  h+='<div id="list" style="display:flex;flex-direction:column;gap:10px"></div>';
  h+='<div class="note" style="text-align:center;margin-top:4px">状態や結果は、店長が「店長日報」の「これまでの提案、その後どうなった？」で更新します。</div>';
  $('main').innerHTML=h;
  renderList();
}

function renderList(){
  var q=state.q.trim().toLowerCase();
  var list=state.items.filter(function(x){
    if(state.shop!=='all'&&x.shop!==state.shop)return false;
    if(state.status&&x.st!==state.status)return false;
    if(q){var p=x.p,t=[p.title,p.problem,p.cause,p.idea,p.effect,p.who,p.result,p.decisionNote].join(' ').toLowerCase();if(t.indexOf(q)<0)return false}
    return true;
  });
  var h='';
  if(!state.loaded)h='<div class="card empty">読み込み中…</div>';
  else if(!list.length)h='<div class="card empty">'+(state.items.length?'当てはまる提案がありません。':'まだ改善提案がありません。')+'</div>';
  else{
    // 状態ごとにまとめて表示（試している → 判断待ち → 効果あり → 効果なし → 保留 → 見送り）
    ORDER.forEach(function(s){
      var g=list.filter(function(x){return x.st===s});if(!g.length)return;
      h+='<div class="sec-t"><span>'+ST[s].icon+' '+esc(ST[s].lb)+'</span><span style="font-weight:700">'+g.length+'件</span></div>';
      g.forEach(function(x){h+=cardHTML(x)});
    });
  }
  $('list').innerHTML=h;
}

function trackHTML(x){
  var S=ST[x.st],p=x.p,stg=S.stage;
  var ended=x.st==='保留'||x.st==='見送り';
  var res3=x.st==='効果あり（定着）'?'効果あり':x.st==='効果なし（やめる）'?'効果なし':'結果';
  var dot=function(n,lb,mark,sub){var done=n<=stg&&!(ended&&n>1),now=n===stg;
    return '<div class="st'+(done?' done':'')+(now?' now':'')+'"><div class="d">'+(done?mark:'')+'</div><div class="t">'+lb+'</div>'+(sub?'<div class="t" style="font-weight:700">'+sub+'</div>':'')+'</div>'};
  var ln=function(n){return '<div class="ln'+(n<stg&&!ended?' done':'')+'"></div>'};
  return '<div class="track">'+
    dot(1,'提案','✓',dLabel(x.k).replace(/（.）/,''))+ln(1)+
    dot(2,ended?esc(S.lb):'試す','✓','')+ln(2)+
    dot(3,res3,x.st==='効果なし（やめる）'?'×':'★',p.resultAt&&stg===3?tLabel(p.resultAt):'')+
  '</div>';
}
function cardHTML(x){
  var S=ST[x.st],p=x.p,ds=daysSince(x.k);
  var warn='';
  if(x.st==='採用・試行中'&&!p.result&&ds>=STALE_DAYS)warn='<span class="warn">⏰ 試して'+ds+'日・結果を書いてください</span>';
  else if(x.st==='提案'&&p.needDecision)warn='<span class="warn">代表の判断待ち</span>';
  var row=function(lb,v,more){return v?'<'+(more?'div class="more"':'div style="display:contents"')+'><dt>'+lb+'</dt><dd>'+esc(v)+'</dd></div>':''};
  var h='<div class="pc" style="--c:'+S.c+';--cb:'+S.cb+'" onclick="toggle(this)">'+
    '<div class="top"><span class="shop '+x.shop+'">'+SHOPNAME[x.shop]+'</span><span>'+dLabel(x.k)+' の提案</span>'+
      '<span class="spacer"></span><span class="badge">'+S.icon+' '+esc(S.lb)+'</span>'+warn+'</div>'+
    '<div class="ttl">'+esc(p.title)+'</div>'+
    trackHTML(x)+
    '<dl class="kv">'+
      row('何が起きたか',p.problem,false)+
      row('どう変える',p.idea,false)+
      row('なぜ',p.cause,true)+
      row('ねらい',p.effect,true)+
      row('誰が・いつ',p.who,true)+
      row('提案した人',x.author,true)+
    '</dl>';
  if(p.result)h+='<div class="res"><b>'+(x.st==='効果あり（定着）'?'🎉 結果':x.st==='効果なし（やめる）'?'🔁 結果（学び）':'📝 途中の様子')+'</b>'+(p.resultAt?'<span class="note">（'+tLabel(p.resultAt)+'）</span>':'')+'：'+esc(p.result)+'</div>';
  if(p.decisionNote)h+='<div class="note" style="margin-top:6px">💬 代表：'+esc(p.decisionNote)+'</div>';
  if(p.cause||p.effect||p.who||x.author)h+='<div class="tap">タップでくわしく</div>';
  h+='</div>';
  return h;
}

boot();
</script>
</body>
</html>
