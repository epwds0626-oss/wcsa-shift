<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<title>料理のコツ帳</title>
<style>
:root{
  --ice:#E6EBED;
  --ice-2:#F2F5F6;
  --ink:#0E212B;
  --ai:#1F4E5F;
  --ai-2:#2E6E82;
  --gin:#6F7E85;
  --gin-2:#9AA8AD;
  --chiai:#A8342B;
  --kombu:#6B7A3C;
  --line:rgba(14,33,43,.14);
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  --sans:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--ice);color-scheme:light only;-webkit-text-size-adjust:100%}
body{
  background:var(--ice);
  min-height:100vh;
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}

header{
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#F4F7F8,var(--ice));
  position:sticky;top:0;z-index:40;
  backdrop-filter:blur(6px);
}
.head-in{max-width:1080px;margin:0 auto;padding:14px 20px 0}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{font-family:var(--serif);font-size:26px;font-weight:600;margin:0;letter-spacing:.16em}
.brand .sub{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--gin);text-transform:uppercase}
.brand .count{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ai);margin-left:auto}

.controls{display:flex;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap}
.search{
  flex:1 1 220px;min-width:180px;padding:9px 14px;border:1px solid var(--line);
  background:#fff;border-radius:2px;font-family:var(--sans);font-size:14px;color:var(--ink);
}
.search::placeholder{color:var(--gin-2)}
.search:focus{outline:2px solid var(--ai-2);outline-offset:1px}
.shuffle{
  appearance:none;border:1px solid var(--line);background:#fff;cursor:pointer;
  font-family:var(--sans);font-size:13px;color:var(--ai);
  padding:9px 16px;border-radius:2px;letter-spacing:.04em;white-space:nowrap;
}
.shuffle:hover{background:var(--ice-2);border-color:var(--ai-2)}

.filters{display:flex;flex-wrap:wrap;gap:5px;padding:12px 0 14px}
.f-btn{
  appearance:none;cursor:pointer;font-family:var(--sans);font-size:12.5px;
  padding:5px 13px;border:1px solid var(--line);background:transparent;color:var(--gin);
  border-radius:99px;letter-spacing:.02em;display:flex;align-items:center;gap:5px;
}
.f-btn .n{font-family:var(--mono);font-size:10px;color:var(--gin-2)}
.f-btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ice-2)}
.f-btn[aria-pressed="true"] .n{color:var(--gin-2)}
.f-btn:focus-visible{outline:2px solid var(--ai-2);outline-offset:2px}

main{max-width:1080px;margin:0 auto;padding:18px 20px 90px}

.spotlight{
  background:#fff;border:1px solid var(--line);border-left:3px solid var(--kombu);
  padding:20px 22px;margin-bottom:26px;position:relative;
}
.spotlight .eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--gin);margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;
}
.spotlight .genre{font-size:11px;color:var(--kombu)}
.spotlight .st-title{font-family:var(--serif);font-size:19px;font-weight:600;margin:0 0 8px;letter-spacing:.03em;line-height:1.4}
.spotlight .st-body{font-size:14.5px;margin:0}
.spotlight .st-again{
  margin-top:14px;appearance:none;border:1px solid var(--line);background:transparent;cursor:pointer;
  font-family:var(--mono);font-size:11px;color:var(--ai);padding:5px 12px;border-radius:2px;letter-spacing:.08em;
}
.spotlight .st-again:hover{background:var(--ice-2)}

.grp-head{
  font-family:var(--serif);font-size:18px;letter-spacing:.08em;font-weight:600;
  margin:26px 0 4px;padding-bottom:8px;border-bottom:2px solid var(--ink);
  display:flex;align-items:baseline;gap:10px;
}
.grp-head:first-of-type{margin-top:6px}

.tlist{display:grid;grid-template-columns:1fr 1fr;gap:0 34px}
@media(max-width:820px){.tlist{grid-template-columns:1fr}}
.tcard{break-inside:avoid;border-top:1px solid var(--line);padding:15px 0 17px}
.tcard .th{display:flex;gap:10px;align-items:baseline;margin-bottom:5px}
.tcard .tnum{font-family:var(--mono);font-size:10px;color:var(--gin-2);flex:0 0 auto;padding-top:2px}
.tcard .tt{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.03em;line-height:1.45;margin:0}
.tcard .tb{font-size:14px;margin:0;color:#12333f}
.tcard mark{background:rgba(107,122,60,.2);color:var(--kombu);padding:0 2px;border-radius:2px}

.empty{text-align:center;color:var(--gin);font-size:14px;padding:60px 20px}
.empty .big{font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:8px}

footer{max-width:1080px;margin:0 auto;padding:0 20px 60px;color:var(--gin);font-size:12px;line-height:1.9}
footer hr{border:0;border-top:1px solid var(--line);margin:0 0 16px}

@media(max-width:600px){
  .brand h1{font-size:22px}
  .brand .count{width:100%;margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="head-in">
    <div class="brand">
      <h1>料理のコツ帳</h1>
      <span class="sub">the why of cooking</span>
      <span class="count" id="count"></span>
    </div>
    <div class="controls">
      <input class="search" id="q" type="search" placeholder="キーワードで探す（例：塩、大根、アク、火加減）" aria-label="コツを検索">
      <button class="shuffle" id="shuffle" type="button">🎲 ランダム</button>
    </div>
    <div class="filters" id="filters"></div>
  </div>
</header>

<main>
  <section class="spotlight" id="spotlight" hidden>
    <div class="eyebrow"><span>今日のひとつ</span><span class="genre" id="sp-genre"></span></div>
    <h3 class="st-title" id="sp-title"></h3>
    <p class="st-body" id="sp-body"></p>
    <button class="st-again" id="sp-again" type="button">別のコツを見る</button>
  </section>
  <div id="list"></div>
</main>

<footer>
  <hr>
  科学的根拠は食品科学・調理科学の一般的知見に基づく。分量や時間は目安。<br>
  食材の状態・季節・産地で最適は変わります。「なぜ」を知って、目の前の素材に合わせて調整を。
</footer>

<script>
const GENRES={
  green:  {label:'青菜・葉物'},
  root:   {label:'根菜・いも'},
  veg:    {label:'野菜全般・アク・下ごしらえ'},
  onion:  {label:'玉ねぎ・香味野菜'},
  meat:   {label:'肉の下ごしらえ・焼き'},
  egg:    {label:'卵'},
  rice:   {label:'米・ごはん'},
  dashi:  {label:'出汁・うま味'},
  salt:   {label:'塩・砂糖・調味の順序'},
  season: {label:'醤油・酢・油・調味料'},
  heat:   {label:'火加減・加熱の科学'},
  flour:  {label:'粉物・衣・揚げ'},
  soup:   {label:'煮る・汁物・煮物'},
  keep:   {label:'保存・下処理・段取り'},
  taste:  {label:'味の設計・盛り付け'}
};

const T=[
/* ===== 青菜・葉物 ===== */
{g:'green',t:'青菜を茹でる湯に塩を入れる理由',b:'塩は色止めが主目的。ナトリウムがクロロフィル（葉緑素）の分解を抑え、鮮やかな緑を保つ。さらに沸点をわずかに上げて素早く火を通し、細胞の煮崩れを防ぐ。目安は湯の1〜2%。'},
{g:'green',t:'茹でた青菜はすぐ冷水にとる',b:'余熱で火が入り続けると色がくすみ食感も落ちる。冷水で一気に温度を下げて加熱を止め、鮮やかさとシャキッとした歯ざわりを固定する（色止め・食感保持）。'},
{g:'green',t:'ほうれん草は水にさらしてアクを抜く',b:'えぐみの原因シュウ酸は水溶性。茹でてから冷水にさらすと溶け出る。ただしさらしすぎると栄養も逃げるので短時間で。小松菜はアクが少なく生でも使える。'},
{g:'green',t:'青菜は根元から先に湯に入れる',b:'根元は火が通りにくく葉先は早い。根元を先に数十秒沈めてから全体を入れると、火の通りが揃って葉がクタクタになりすぎない。'},
{g:'green',t:'葉物は立てて保存すると長持ち',b:'野菜は畑で立っていた向きで保存すると呼吸ストレスが減り鮮度が保てる。ほうれん草・ねぎなどは濡れ新聞に包み冷蔵庫で立てて置く。'},
{g:'green',t:'キャベツは芯をくり抜いて保存',b:'芯（成長点）が生きていると葉の養分を吸って傷みが早い。芯をくり抜いて濡らしたペーパーを詰めると成長が止まり日持ちする。'},
{g:'green',t:'レタスは包丁より手でちぎる',b:'金属の刃が切り口の細胞を壊すと酸化して赤茶色に変色しやすい。手でちぎると繊維に沿って裂けるので変色しにくく、ドレッシングも絡みやすい。'},
{g:'green',t:'苦い葉物は油と合わせると食べやすい',b:'春菊・菜の花などの苦味成分は脂溶性。油で炒める・ドレッシングと和えると苦味が和らぎ、脂溶性のβカロテンの吸収も上がる。'},

/* ===== 根菜・いも ===== */
{g:'root',t:'大根は部位で辛味が違う',b:'根の先端（下）ほど辛味成分が多く、葉に近い上部ほど甘い。上部は生でサラダや大根おろしの甘め、中央は煮物、先端は辛い大根おろしや味噌汁と使い分ける。'},
{g:'root',t:'大根おろしは切り方で辛さが変わる',b:'辛味成分は細胞が壊れるほど強く出る。円を描くように速くおろすと辛く、垂直にゆっくりおろすと辛味が穏やか。おろして時間を置くと辛味が飛ぶ。'},
{g:'root',t:'大根の下茹でに米のとぎ汁を使う',b:'とぎ汁のでんぷんが大根のえぐみ・苦味を吸着し、米ぬかの成分が繊維をやわらげる。透明感が出て味も染みやすくなる。米を一つまみ入れて茹でても同じ効果。'},
{g:'root',t:'ごぼう・れんこんは酢水にさらす',b:'切り口のポリフェノール（アク）が酸化して黒くなるのを酢が防ぐ。白く仕上げたいときに有効。ただし長くさらすと風味も抜けるので短時間で。'},
{g:'root',t:'じゃがいもは水から茹でる',b:'いもは中心まで火が通るのに時間がかかる。熱湯に入れると外だけ煮崩れて中が生になる。水から徐々に加熱すると中心まで均一に火が入る。根菜の煮物全般に共通。'},
{g:'root',t:'新じゃがと男爵・メークインの使い分け',b:'男爵はホクホク崩れやすくコロッケ・マッシュ向き。メークインは煮崩れしにくく煮物・カレー向き。でんぷんの量と細胞構造の違い。'},
{g:'root',t:'里芋のぬめりは塩でこすると取れる',b:'ぬめり（ガラクタン等の多糖）が味の染み込みを妨げる。皮をむいて塩をまぶしこすり、下茹でするとぬめりが減って味が入りやすくなる。'},
{g:'root',t:'にんじんは油と一緒に摂ると吸収が上がる',b:'βカロテンは脂溶性。生のままより油で炒める・ドレッシングと合わせると体内での吸収率が数倍に上がる。きんぴらや炒め物は理にかなっている。'},
{g:'root',t:'たけのこは米ぬかと唐辛子で茹でる',b:'ぬかのカルシウムとでんぷんがえぐみ成分（シュウ酸・ホモゲンチジン酸）を吸着し、唐辛子が酸化を抑える。掘りたてほどアクが少ないので鮮度が命。'},
{g:'root',t:'かぼちゃは面取りで煮崩れを防ぐ',b:'角があるとそこから崩れる。角を薄く削る「面取り」で煮崩れが減り、見た目も美しく味も均一に染みる。大根・里芋など煮物全般に有効。'},
{g:'root',t:'いもの皮は加熱してからむくと楽',b:'加熱すると皮と身の間の細胞がゆるむ。里芋やじゃがいもは茹でてからむくとつるりとむけ、廃棄も少ない。熱いうちに布巾で包んでむく。'},

/* ===== 野菜全般・アク・下ごしらえ ===== */
{g:'veg',t:'なすは油を吸うので先に塩や油をなじませる',b:'なすのスポンジ状の組織は油を大量に吸う。切ってから塩をふって水分を出す、または先に少量の油をからめておくと吸油量が減り、色よく仕上がる。'},
{g:'veg',t:'トマトの湯むきは冷水との温度差で',b:'切れ目を入れて熱湯に数秒→冷水にとると、皮と身の膨張率の差で皮がめくれる。皮の口当たりを消したいソースや煮込みに。'},
{g:'veg',t:'きのこは洗わず拭く',b:'きのこは水を吸うと風味とうま味（グアニル酸）が流れ、食感も水っぽくなる。汚れは濡れ布巾やペーパーで拭き取る。加熱で増えるうま味を逃さない。'},
{g:'veg',t:'きのこは冷凍でうま味が増す',b:'凍結で細胞壁が壊れ、加熱時にうま味成分（グアニル酸）が出やすくなる。使う分を冷凍しておくと味が濃く出て便利。'},
{g:'veg',t:'ピーマンは繊維に沿って縦切りで苦味減',b:'繊維を断つ横切りは細胞が壊れて苦味が出やすい。縦に繊維に沿って切ると苦味が穏やかで食感も残る。加熱時間が短いほど苦味は弱い。'},
{g:'veg',t:'アスパラは根元の皮をむき、はかまを取る',b:'根元は硬い繊維とはかま（三角の葉）が口に残る。ピーラーで下1/3の皮をむき、はかまを取ると全体が均一な食感になる。'},
{g:'veg',t:'トマトは加熱でうま味が跳ね上がる',b:'トマトはグルタミン酸を多く含む数少ない野菜。加熱すると水分が飛んでうま味が凝縮し、肉や魚のイノシン酸と相乗する。煮込みの土台に向く。'},
{g:'veg',t:'ブロッコリーは茎まで使える',b:'茎の外側は硬いが、皮を厚めにむいた中心は甘くやわらかい。捨てずに薄切りにして炒め物やスープへ。房よりビタミンが多い部分もある。'},
{g:'veg',t:'切った野菜の断面を下にして焼く',b:'水分の多い断面から先に焼き付けると、メイラード反応で香ばしさが出て水っぽくならない。ズッキーニ・なす・玉ねぎなどの焼き野菜に。'},
{g:'veg',t:'アク抜きは目的で使い分ける',b:'色を白く保つなら酢水、えぐみ抜きなら水や塩水、繊維をやわらげるなら米のとぎ汁。アクの正体（ポリフェノール・シュウ酸など）で最適な方法が変わる。'},
{g:'veg',t:'塩もみは水分を抜いて味を凝縮',b:'きゅうり・白菜などに塩をふると浸透圧で水が抜け、しんなりして味が入りやすくなる。和え物・浅漬けの下ごしらえ。出た水は絞って捨てる。'},

/* ===== 玉ねぎ・香味野菜 ===== */
{g:'onion',t:'玉ねぎを炒めて甘くなるのは糖の濃縮とメイラード',b:'加熱で水分が飛んで糖が濃縮し、さらにメイラード反応で香ばしい甘みが生まれる。飴色玉ねぎはこの二段構え。辛味成分は加熱で揮発して消える。'},
{g:'onion',t:'玉ねぎで涙が出るのは切ると出る硫黄化合物',b:'細胞が壊れると酵素が反応して催涙成分が発生する。冷やす・よく切れる包丁を使う・繊維に沿って切る・換気で軽減できる。'},
{g:'onion',t:'玉ねぎは繊維に沿うか断つかで食感が変わる',b:'繊維に沿って縦切りするとシャキッと形が残り炒め物向き。繊維を断つ横切りは細胞が壊れて甘みと辛味が出やすく、早く火が通る。用途で使い分ける。'},
{g:'onion',t:'にんにく・生姜は油に香りを移してから使う',b:'香り成分は脂溶性。冷たい油から弱火でじっくり熱すると香りが油に移る。焦がすと苦くなるので、色づく前に本材料を入れるのがコツ。'},
{g:'onion',t:'にんにくは切り方で香りの強さが変わる',b:'細胞を壊すほど香りと辛味が強く出る。すりおろし＞みじん切り＞薄切り＞丸ごと の順に強い。料理に欲しい香りの強さで切り方を選ぶ。'},
{g:'onion',t:'生姜は皮の近くに香りがある',b:'香り成分は皮のすぐ内側に集中する。皮はスプーンでこそげる程度にとどめると香りを損なわない。'},
{g:'onion',t:'長ねぎの青い部分は臭み消しに使える',b:'青い部分には硫黄化合物が多く、肉や魚の下茹で・煮込みに入れると臭みを吸ってくれる。食べずに取り出す用途。白い部分は薬味や焼きに。'},
{g:'onion',t:'香味野菜は「三位一体」で土台になる',b:'玉ねぎ・にんじん・セロリ（洋）、ねぎ・生姜・にんにく（中）など、香味野菜の組み合わせが料理の香りの基礎を作る。最初に炒めて香りを立てる。'},

/* ===== 肉の下ごしらえ・焼き ===== */
{g:'meat',t:'肉は焼く前に常温に戻す',b:'冷蔵庫から出したての冷たい肉を焼くと、外が焦げても中が生になりやすい。30分ほど室温に置くと火の通りが均一になり、ジューシーに焼ける。'},
{g:'meat',t:'肉は焼く直前に塩をふる',b:'早く塩をふると浸透圧で肉汁（うま味）が抜けてパサつく。焼く直前にふれば表面だけに効いて肉汁を保てる。厚い塊肉は逆に早めに塩をして味を入れる手法もある。'},
{g:'meat',t:'焼いた肉は少し休ませてから切る',b:'焼きたては肉汁が中心に集まり圧が高い。すぐ切ると流れ出る。数分休ませると肉汁が全体に戻り、切っても流れずジューシー。焼き時間の半分が目安。'},
{g:'meat',t:'ステーキの焼き色はメイラード反応',b:'高温でアミノ酸と糖が反応し香ばしい焼き色と風味が生まれる。表面の水分を拭き、しっかり予熱したフライパンで動かさず焼くと綺麗な焼き色がつく。'},
{g:'meat',t:'肉を柔らかくする下ごしらえ',b:'塩麹・ヨーグルト・玉ねぎ・パイナップルなどの酵素がタンパク質を分解して柔らかくする。長く漬けすぎるとボロボロになるので時間管理を。'},
{g:'meat',t:'筋切りで焼き縮みを防ぐ',b:'赤身と脂身の境の筋は加熱で縮んで肉が反る。数か所包丁で断つと平らに焼け、火の通りも均一になる。とんかつ・ソテーに。'},
{g:'meat',t:'鶏肉は皮目から焼く',b:'皮の脂を溶かし出しながらパリッと焼き、その脂で身を焼く。皮目を8割、身側を2割の時間配分が目安。動かさず押さえて焼くと均一にパリッとする。'},
{g:'meat',t:'ひき肉は塩を先に入れてよく練る',b:'塩でタンパク質（ミオシン）が溶け出して粘りが出て、加熱してもジューシーで割れにくいハンバーグ・つくねになる。塩→よく練る→他の材料の順。'},
{g:'meat',t:'肉の下茹でで臭みとアクを抜く',b:'角煮やもつ煮は、一度下茹でしてアク（血・脂・雑味）を捨てると澄んだ味になる。ねぎの青い部分や生姜を一緒に入れるとさらに臭みが取れる。'},
{g:'meat',t:'薄切り肉は繊維を断つと柔らかい',b:'繊維に対して直角に切ると噛み切りやすく柔らかく感じる。繊維に沿うと歯ごたえが出る。焼肉や炒め物は繊維を断つ切り方が食べやすい。'},

/* ===== 卵 ===== */
{g:'egg',t:'卵は白身と黄身で固まる温度が違う',b:'黄身は約65〜70℃、白身は約80℃で固まる。この差を使うと、白身は固まり黄身はとろりの温泉卵（約68℃で保温）ができる。'},
{g:'egg',t:'ゆで卵は古い卵のほうがむきやすい',b:'新鮮な卵は白身のpHが低く殻に密着する。数日置くとpHが上がって膜がはがれやすくなる。ゆでた後すぐ冷水で急冷し、殻にひびを入れると水が入ってむきやすい。'},
{g:'egg',t:'炒り卵・オムレツは弱めの火で手早く',b:'卵のタンパク質は強火だとすぐ固まって水分が抜け、パサついて硬くなる。弱〜中火で手早くかき混ぜると、ふんわりトロッと仕上がる。'},
{g:'egg',t:'卵液に砂糖を入れると固まりにくい',b:'砂糖はタンパク質同士の結合を邪魔し、固まる温度を上げて食感をやわらげる。だし巻き卵やプリンがしっとりなめらかになる。'},
{g:'egg',t:'茶碗蒸し・プリンは「す」が入らない温度で',b:'高温で急激に加熱すると内部の水が沸騰して気泡（す）ができる。85〜90℃程度の穏やかな蒸し・湯煎で、なめらかに固まる。'},
{g:'egg',t:'マヨネーズは油を少しずつで乳化する',b:'卵黄のレシチンが乳化剤。最初に油をドバッと入れると分離する。少量ずつ加えてよく混ぜると、水と油が細かく混ざり合って安定したクリーム状になる。'},
{g:'egg',t:'卵白の泡立てには油分・水分が大敵',b:'メレンゲは卵白のタンパク質が空気を抱き込んで泡になる。ボウルや泡立て器に油や卵黄が少しでも混じると泡立たない。清潔で乾いた道具を使う。'},
{g:'egg',t:'温泉卵と半熟卵は仕組みが逆',b:'温泉卵は白身ゆるめ黄身固め（約68℃保温）。半熟卵は白身固め黄身とろり（熱湯で短時間）。固まる温度差をどう使うかの違い。'},

/* ===== 米・ごはん ===== */
{g:'rice',t:'米は最初の水を素早く捨てる',b:'乾いた米は最初の水を一気に吸う。ぬか臭い最初のとぎ汁を吸わせないよう、1回目はさっと混ぜてすぐ捨てる。最初の水の質がごはんの香りを左右する。'},
{g:'rice',t:'米は炊く前に浸水させる',b:'米の中心までしっかり水を吸わせてから炊くと、芯が残らずふっくら炊ける。夏は30分、冬は1時間が目安。急ぐなら少しぬるま湯で。'},
{g:'rice',t:'炊きあがりはすぐほぐして蒸らしを飛ばす',b:'炊けたら底から返して余分な蒸気を逃がす。放置すると下の米が水分で潰れてべたつく。空気を含ませると一粒一粒が立つ。'},
{g:'rice',t:'寿司飯は炊きたてに酢を切るように混ぜる',b:'熱いうちに合わせ酢を回しかけ、しゃもじで切るように混ぜて団扇であおぐ。練ると潰れる。あおいで水分を飛ばすとツヤと締まりが出る。'},
{g:'rice',t:'冷やごはんはでんぷんが老化して硬くなる',b:'炊いた米のでんぷんは冷えると結晶化して硬くパサつく（老化）。温め直すと戻るが完全ではない。冷凍→レンジ加熱のほうが炊きたてに近い。'},
{g:'rice',t:'おにぎりは握りすぎない',b:'ぎゅっと握ると米が潰れて硬くなる。ふんわり形を整える程度に握ると、口の中でほどけて美味しい。塩は手水に混ぜると均一につく。'},
{g:'rice',t:'炊き込みごはんは醤油を後入れで色よく',b:'醤油を最初から入れると塩分で米が水を吸いにくく芯が残りやすい。だしと具で炊き、色づけの醤油は控えめに。塩分は米が水を吸うのを妨げる。'},
{g:'rice',t:'米は洗いすぎない',b:'昔の精米が悪かった時代の「研ぐ」は今は不要。現代の米は数回さっとすすげば十分。研ぎすぎると米が割れ、うま味も流れる。'},

/* ===== 出汁・うま味 ===== */
{g:'dashi',t:'昆布は水から、沸騰直前で引き上げる',b:'昆布のうま味（グルタミン酸）は水にゆっくり溶け出す。煮立てるとぬめりと磯臭さが出て濁る。60〜80℃を保つと澄んだ上品な出汁になる。'},
{g:'dashi',t:'かつお出汁は煮立てず、さっと',b:'削り節を入れたら煮立てず火を止め、沈んだら漉す。長く煮ると渋み・えぐみが出て香りが飛ぶ。一番出汁は香りが命で数十秒が勝負。'},
{g:'dashi',t:'うま味は掛け算になる',b:'昆布（グルタミン酸）＋かつお（イノシン酸）を合わせると、単独の何倍も強いうま味を感じる（相乗効果）。合わせ出汁が美味い科学的理由。'},
{g:'dashi',t:'干し椎茸は水で戻すとうま味が出る',b:'グアニル酸は水戻しの過程で酵素により生成される。冷水でゆっくり戻すほどうま味が増す。戻し汁も立派な出汁なので捨てない。'},
{g:'dashi',t:'煮干し出汁は頭と腹わたを取ると雑味が減る',b:'頭と内臓には苦味・えぐみがある。取り除いて水に浸けておくと澄んだ出汁に。丁寧に作るなら、から煎りしてから使うと生臭さも抑えられる。'},
{g:'dashi',t:'野菜の切れ端でも出汁は取れる',b:'玉ねぎの皮、にんじんのへた、セロリの葉などの端材を煮出すと洋風出汁（ベジブロス）になる。うま味と甘みが溶け出す。捨てる前に活用できる。'},
{g:'dashi',t:'干し貝柱・干しえびもうま味の宝庫',b:'乾物は水分が抜けてうま味成分が凝縮している。戻し汁ごと使うと料理に濃いコクが出る。中華や炊き込みごはんの隠し味に。'},

/* ===== 塩・砂糖・調味の順序 ===== */
{g:'salt',t:'調味料は「さしすせそ」の順',b:'砂糖→塩→酢→醤油→味噌。砂糖は分子が大きく染み込みにくいので先に。塩は素材を締めるので後だと砂糖が入らない。酢・醤油・味噌は香りが飛ぶので後半に。'},
{g:'salt',t:'砂糖を先に入れる理由',b:'砂糖は分子が大きく素材に染み込むのに時間がかかる。塩を先に入れると素材が締まって砂糖が入らなくなる。だから甘みは最初に含ませる。'},
{g:'salt',t:'塩は味を締め、砂糖は保水する',b:'塩は浸透圧で水を抜き味を凝縮・引き締める。砂糖は水を抱えてしっとりさせる。両方使うと締まりとしっとりのバランスが取れる。'},
{g:'salt',t:'塩ひとつまみで甘みが引き立つ',b:'少量の塩は甘味を強く感じさせる（対比効果）。あんこ・スイカ・お汁粉に塩を少し入れると甘さが際立つ。逆に甘味は塩味の角を取る。'},
{g:'salt',t:'味付けは薄めから、後で足す',b:'塩分は入れたら引けない。薄めに仕上げて味見しながら足すのが鉄則。冷めると味を強く感じるので、温かい料理はやや薄めに仕上げる。'},
{g:'salt',t:'塩の種類で溶け方と当たりが違う',b:'精製塩は溶けやすく味が均一、粗塩・岩塩はゆっくり溶けて角がまろやか。下味は精製塩、仕上げのアクセントには粗塩を指でつまんで、と使い分ける。'},
{g:'salt',t:'砂糖には保水・発酵・焼き色の働きもある',b:'砂糖は甘みだけでなく、パンの発酵を助け、焼き菓子に焼き色（カラメル化・メイラード）をつけ、水分を保って乾燥を防ぐ。ただの甘味料ではない。'},
{g:'salt',t:'味に迷ったら「うま味・酸・塩」で調整',b:'ぼやけた味は塩か酸（酢・レモン）を少し。しつこい味は酸で切る。コク不足はうま味（出汁・チーズ・トマト）を足す。味の輪郭は主にこの3要素で整う。'},

/* ===== 醤油・酢・油・調味料 ===== */
{g:'season',t:'醤油は香りが命、火を止める直前に',b:'醤油の香ばしい香りは加熱で飛ぶ。煮物は色づけに最初、仕上げの風味づけに最後、と二段で使うと香りとコクが両立する。'},
{g:'season',t:'酢は加熱で酸味がまろやかになる',b:'酢の酸味成分は加熱で一部揮発する。酸っぱさを抑えたいなら煮る、シャープに効かせたいなら仕上げに。合わせ酢は火を通すと角が取れる。'},
{g:'season',t:'みりんは「煮切って」使うと上品',b:'本みりんのアルコールを煮飛ばす（煮切り）と、まろやかな甘みとツヤだけが残る。和え物や生食用のたれはアルコール臭を消すため煮切る。'},
{g:'season',t:'油は種類で香りと耐熱が違う',b:'ごま油・オリーブオイルは香りを活かすので仕上げや低温向き。サラダ油・米油は高温に強く揚げ物向き。エキストラバージンは加熱で香りが飛ぶので生で。'},
{g:'season',t:'味噌は最後に溶き入れる',b:'味噌の香りと風味は加熱で飛び、煮立てると分離してざらつく。火を止める直前に溶き入れ、煮立てないのが味噌汁の基本。'},
{g:'season',t:'酒は臭みを消し、素材をやわらげる',b:'アルコールが臭み成分を一緒に揮発させ、うま味成分（アミノ酸）も含む。肉魚の下味や煮物に使うと臭みが抜けてコクが出る。'},
{g:'season',t:'ソースやたれは「とろみ」でからむ',b:'水っぽいたれは素材に乗らない。片栗粉・煮詰め・油の乳化などでとろみをつけると、素材に密着して味がしっかり伝わる。'},
{g:'season',t:'酸味は油っぽさを切る',b:'揚げ物にレモン、脂の乗った肉魚に酢やポン酢。酸が舌をリセットして後味を軽くする。味のバランスを整える働き。'},

/* ===== 火加減・加熱の科学 ===== */
{g:'heat',t:'メイラード反応は「香ばしさ」の正体',b:'高温（150℃前後〜）でアミノ酸と糖が反応し、焼き色と香ばしい風味が生まれる。焼き目・焦げ目・パンの皮・肉の焼き色すべてこの反応。表面を乾かすと起きやすい。'},
{g:'heat',t:'水分がある間は100℃を超えない',b:'水が残っていると蒸発に熱が使われ表面温度が上がらず焼き色がつかない。焼き付けたいなら先に水分を飛ばす。「炒める」と「蒸し焼き」の分かれ目。'},
{g:'heat',t:'予熱をしっかりすると食材がくっつかない',b:'冷たいフライパンに食材を入れるとタンパク質が金属に結合する。十分予熱してから入れ、焼き色がつくまで動かさないと自然に剥がれる。'},
{g:'heat',t:'強火で一気か、弱火でじっくりか',b:'表面を香ばしく・中は生かしたいなら強火短時間。中まで火を通したい・柔らかくしたいなら弱火長時間。素材の厚みと仕上がりで火加減を決める。'},
{g:'heat',t:'炒め物は強火・手早く・少量ずつ',b:'一度に入れると温度が下がって水が出て「蒸し煮」になる。フライパンを熱し、少量ずつ手早く炒めるとシャキッと香ばしく仕上がる。'},
{g:'heat',t:'低温調理はタンパク質の変性温度を利用',b:'肉や魚は50〜65℃で固まり始め、高温ほど収縮して水が抜ける。低温を保つと火は通るのに柔らかくジューシー。温度管理が仕上がりを決める。'},
{g:'heat',t:'蒸し料理は水に浸けないから流出しない',b:'蒸気で穏やかに全体を包み、水に浸けないのでうま味も栄養も流れない。野菜は色よく、魚はふっくら仕上がる。'},
{g:'heat',t:'余熱で火を通すと硬くならない',b:'火を止めても鍋やフライパンには熱が残る。仕上がり直前で火を止め余熱で通すと、加熱しすぎによるパサつきや硬化を防げる。'},
{g:'heat',t:'落とし蓋で少ない煮汁でも均一に',b:'落とし蓋が煮汁を全体に対流させ、少量の煮汁でも上下ムラなく味が染みる。素材が動かず煮崩れも防ぐ。煮物の基本の道具。'},
{g:'heat',t:'炭火・グリルが美味いのは遠赤外線',b:'遠赤外線は表面を焦がさず内部まで熱を伝える。滴った脂が焦げて生じる燻煙も香りをつける。直火焼きの香ばしさの正体。'},

/* ===== 粉物・衣・揚げ ===== */
{g:'flour',t:'揚げ物の衣は水分を油に置換してサクサク',b:'高温の油で衣の水分が一気に蒸発し、空いた隙間に油が入って多孔質になる。だから軽い。低温だと水が抜けずベチャつく。'},
{g:'flour',t:'天ぷらの衣は冷水・混ぜすぎない',b:'グルテンが出ると衣が重くなる。冷水で粉のグルテン生成を抑え、粉っぽさが残る程度にさっと混ぜる。混ぜすぎ・常温はカラッと揚がらない原因。'},
{g:'flour',t:'揚げ油の温度は素材で変える',b:'火の通りにくい根菜は低め（160℃）でじっくり、火が入りやすい魚介や仕上げは高め（180℃）で短時間。温度計がなければ衣を落として泡の出方で判断。'},
{g:'flour',t:'二度揚げでカラッと仕上げる',b:'一度目は低温で中まで火を通し、油を切って休ませる。二度目は高温で表面を一気に脱水。余熱でも火が入り、外はサクサク中はジューシー。'},
{g:'flour',t:'パン粉は生パン粉と乾燥で食感が違う',b:'生パン粉は水分が多く粗くザクザク、乾燥パン粉は細かくカリッと均一。フライの食感の好みで使い分ける。'},
{g:'flour',t:'小麦粉のグルテンは練るほど強くなる',b:'水を加えて練るとグルテンが網目状につながり、コシと弾力が出る。うどん・パンは練り、天ぷら衣・お菓子はグルテンを出さないよう混ぜすぎない。目的で真逆。'},
{g:'flour',t:'唐揚げの下味は時間で染み方が変わる',b:'醤油・生姜・にんにくの下味は30分〜で表面に、一晩で中まで。片栗粉はカリッと、小麦粉はふんわり。粉の種類と漬け時間で食感と味が変わる。'},
{g:'flour',t:'揚げ物は油をたっぷり、一度に入れすぎない',b:'油が少ないと温度が急降下する。多めの油で、鍋の表面積の半分以下ずつ入れると温度が保たれてカラッと揚がる。'},
{g:'flour',t:'とんかつは肉を叩いて筋を切る',b:'肉を軽く叩いて繊維をほぐし、赤身と脂の境の筋を切ると、揚げても反らず柔らかい。厚みを均一にすると火の通りも揃う。'},

/* ===== 煮る・汁物・煮物 ===== */
{g:'soup',t:'煮物は冷める時に味が染みる',b:'味が入るのは加熱中ではなく、冷めていく過程。温度が下がると煮汁が素材に吸い込まれる。一度冷ますと味がぐっと染みるので、作り置き・追い炊きが有効。'},
{g:'soup',t:'アク取りで澄んだ汁になる',b:'アクは血・タンパク質・雑味の集まり。煮立ちはじめに浮くので丁寧にすくうと、澄んで雑味のない仕上がりに。取りすぎるとうま味も減るので加減を。'},
{g:'soup',t:'煮物は具の大きさと火の通りを揃える',b:'火の通りにくいものは大きめでも早く入れ、崩れやすいものは後入れ。同じ鍋でも入れる順とサイズで火の通りを揃えると全体が均一に仕上がる。'},
{g:'soup',t:'味噌汁は味噌を煮立てない',b:'味噌の香りは加熱で飛び、煮立てると分離してざらつく。具に火が通ったら火を止め、味噌を溶き入れる。再加熱も煮立てないのが基本。'},
{g:'soup',t:'カレー・シチューは一度冷ますととろみと味が増す',b:'冷める過程で具に味が染み、でんぷんが落ち着いてとろみが安定する。「一晩置いたカレー」が美味いのは味の浸透と熟成のため。'},
{g:'soup',t:'汁物は「実だくさん」でうま味が出る',b:'肉・魚・きのこ・野菜など具材からうま味成分が溶け出す。具が多いほど出汁が濃くなる。豚汁やけんちん汁は具そのものが出汁の役割。'},
{g:'soup',t:'煮汁は「ひたひた」「かぶるくらい」を使い分ける',b:'ひたひた＝素材が少し出る量（煮崩れやすいもの）、かぶるくらい＝完全に浸かる量（味を含ませたいもの）、たっぷり＝下茹で。水加減で仕上がりが変わる。'},

{g:'keep',t:'下味冷凍で味が染みて時短',b:'肉や魚に調味料をからめて冷凍すると、冷凍・解凍の過程で細胞に味が入る。解凍しながら味が染みるので、当日は焼くだけ。段取りの武器。'},
{g:'keep',t:'野菜は洗って水気を切ってから保存',b:'濡れたままだと傷みが早い。洗ったらしっかり水気を拭き、ペーパーで包んで保存すると日持ちする。逆に葉物は湿らせた方が良いなど種で異なる。'},
{g:'keep',t:'まとめて下ごしらえ（仕込み）で楽になる',b:'切る・下茹で・下味を一度にまとめておくと、日々の調理が「仕上げるだけ」になる。段取りが料理の速さと安定を決める。'},
{g:'keep',t:'常温・冷蔵・冷凍を食材で使い分ける',b:'いも・玉ねぎ・かぼちゃは常温、葉物・肉魚は冷蔵、作り置き・肉魚の長期は冷凍。冷やすと逆に傷むもの（さつまいも等）もある。適所を知る。'},
{g:'keep',t:'ドリップは拭いてから調理',b:'解凍した肉魚から出る赤い水（ドリップ）は臭みの元。ペーパーで拭き取ってから調理すると仕上がりの臭みが減る。'},
{g:'keep',t:'香味野菜・薬味は冷凍でストック',b:'刻んだねぎ・生姜・にんにくは冷凍しておくと使う分だけ取り出せる。生姜は皮ごと冷凍してすりおろすと繊維も気にならない。時短の定番。'},

{g:'taste',t:'食感のコントラストが料理を面白くする',b:'とろりと歯ごたえ、しっとりとカリッ。異なる食感を組み合わせると単調にならず満足度が上がる。天ぷらに大根おろし、揚げ物に生野菜など。'},
{g:'taste',t:'温度も「味」のうち',b:'同じ料理でも温かいか冷たいかで味の感じ方が変わる。冷めると塩味・甘味を強く感じるので、温製はやや薄め、冷製はしっかりめに味付けする。'},
{g:'taste',t:'彩りは味覚に先立つ',b:'赤・緑・黄・白・黒の五色が揃うと食欲をそそり栄養バランスも取れる。緑（青菜）や赤（トマト・人参）を一点添えるだけで料理が生きる。'},
{g:'taste',t:'盛り付けは「余白」と「高さ」',b:'皿いっぱいに敷き詰めず余白を残し、中央を高く盛ると立体感が出て美味しそうに見える。手前を低く奥を高くすると奥行きが生まれる。'},
{g:'taste',t:'味見は仕上がり温度に近づけて',b:'熱々を味見すると味を薄く感じ、冷めた状態だと濃く感じる。提供する温度に近い状態で味見すると、実際に食べたときの味と一致する。'},
{g:'taste',t:'塩・酸・うま味・脂・香りで「あと一歩」を埋める',b:'味が決まらないときは、塩気が足りないのか、酸で締めるべきか、コク（うま味・脂）不足か、香りが弱いのかを一つずつ試す。原因を切り分けると味が決まる。'}
];

T.forEach((x,i)=>x.no=i+1);

const $=s=>document.querySelector(s);
const listEl=$('#list');
const countEl=$('#count');
let curGenre='all', kw='';

function drawFilters(){
  const box=$('#filters');
  const counts={};
  T.forEach(x=>counts[x.g]=(counts[x.g]||0)+1);
  let html=`<button class="f-btn" data-g="all" aria-pressed="true">すべて<span class="n">${T.length}</span></button>`;
  Object.keys(GENRES).forEach(g=>{
    if(!counts[g])return;
    html+=`<button class="f-btn" data-g="${g}" aria-pressed="false">${GENRES[g].label}<span class="n">${counts[g]}</span></button>`;
  });
  box.innerHTML=html;
  box.querySelectorAll('.f-btn').forEach(b=>b.onclick=()=>{
    curGenre=b.dataset.g;
    box.querySelectorAll('.f-btn').forEach(x=>x.setAttribute('aria-pressed', x===b));
    draw();
  });
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hl(text){
  if(!kw)return esc(text);
  const re=new RegExp('('+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return esc(text).replace(re,'<mark>$1</mark>');
}

function draw(){
  let hit=T.filter(x=>
    (curGenre==='all'||x.g===curGenre) &&
    (!kw||x.t.includes(kw)||x.b.includes(kw))
  );
  countEl.textContent=hit.length+' / '+T.length+' 件';
  if(!hit.length){
    listEl.innerHTML=`<div class="empty"><div class="big">見つかりませんでした</div>別のキーワードで探すか、フィルタを「すべて」に戻してください。</div>`;
    return;
  }
  let html='',lastG='';
  hit.forEach(x=>{
    if(x.g!==lastG){
      if(lastG!=='')html+='</div>';
      html+=`<div class="grp-head">${GENRES[x.g].label}</div><div class="tlist">`;
      lastG=x.g;
    }
    html+=`<div class="tcard">
      <div class="th"><span class="tnum">${String(x.no).padStart(3,'0')}</span><h4 class="tt">${hl(x.t)}</h4></div>
      <p class="tb">${hl(x.b)}</p>
    </div>`;
  });
  html+='</div>';
  listEl.innerHTML=html;
}

function spotlight(){
  const x=T[Math.floor(Math.random()*T.length)];
  $('#spotlight').hidden=false;
  $('#sp-genre').textContent=GENRES[x.g].label;
  $('#sp-title').textContent=x.t;
  $('#sp-body').textContent=x.b;
}

$('#q').addEventListener('input',e=>{kw=e.target.value.trim();draw();});
$('#shuffle').onclick=()=>{ spotlight(); window.scrollTo({top:0,behavior:'smooth'}); };
$('#sp-again').onclick=spotlight;

drawFilters();
draw();
spotlight();
</script>
</body>
</html>
