<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<title>店長日報</title>
<style>
:root{
  --bg:#eef1f3; --surface:#fff; --surface2:#f1f2f6; --surface3:#e7e9ef;
  --border:#d7dae2; --text:#1a1c22; --text2:#5b6070; --text3:#8c92a4;
  --accent:#b07d00; --accent-soft:rgba(176,125,0,.12);
  --ok:#0a7d4f; --ok-soft:#e6f5ee; --warn:#b26a00; --warn-soft:#fff3e0; --crit:#c0001a; --crit-soft:#fdecec;
  --shadow:0 1px 3px rgba(20,25,40,.06),0 4px 16px rgba(20,25,40,.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;font-size:14px}
#app{display:flex;flex-direction:column;height:100%}
.mhead{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:0 1px 6px rgba(20,25,40,.05)}
.row{display:flex;align-items:center;gap:8px;padding:9px 12px;flex-wrap:wrap}
.title{font-size:15px;font-weight:800;white-space:nowrap}
.spacer{flex:1}
.hbtn{border:1px solid var(--border);background:var(--surface2);color:var(--text2);height:34px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.hbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.seg{display:flex;background:var(--surface3);border-radius:10px;padding:3px;gap:2px;flex-shrink:0}
.seg button{border:none;background:transparent;color:var(--text2);font-size:13px;font-weight:700;padding:7px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.datenav{display:flex;align-items:center;gap:4px}
.datenav .arw{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface2);font-size:16px;cursor:pointer;color:var(--text2)}
.datenav .dl{font-size:15px;font-weight:900;min-width:118px;text-align:center;font-variant-numeric:tabular-nums}
.datenav .dl small{display:block;font-size:10.5px;font-weight:700;color:var(--accent)}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 120px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.card h2{font-size:15px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .lead{font-size:12.5px;color:var(--text2);margin-bottom:10px}
.main{border:2px solid var(--accent);background:linear-gradient(0deg,var(--surface),var(--surface)) padding-box}
.main h2{font-size:17px}
.note{font-size:12px;color:var(--text2)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.w{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.c{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.a{background:var(--accent-soft);color:var(--accent);border-color:transparent}
/* 数字 */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kc{border:1px solid var(--border);border-radius:11px;padding:9px 11px;background:var(--surface2)}
.kc .kl{font-size:11.5px;color:var(--text2);font-weight:700;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.kc .kv{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:2px}
.kc .ks{font-size:11.5px;color:var(--text2);font-variant-numeric:tabular-nums}
.kc.total{background:var(--accent-soft);border-color:var(--accent)}
.kc.op .kv.pos{color:var(--ok)} .kc.op .kv.neg{color:var(--crit)}
.kbar{display:flex;height:22px;border-radius:7px;overflow:hidden;margin-top:10px;background:var(--surface3)}
.kbar i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:10.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;min-width:0}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--text2)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--c)}
/* フォーム */
label.f{display:block;font-size:12.5px;font-weight:800;color:var(--text);margin:10px 0 4px}
label.f .q{font-weight:500;color:var(--text2);font-size:11.5px;margin-left:4px}
textarea,input[type=text],input[type=password],select{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 10px;background:#fff;color:var(--text)}
textarea{min-height:64px;resize:vertical;line-height:1.5}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.prop{border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:10px;background:var(--surface2)}
.prop-h{display:flex;align-items:center;gap:8px}
.prop-h .num{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.prop-h input{font-weight:800}
.steps{display:flex;gap:4px;margin:10px 0 2px;flex-wrap:wrap}
.steps span{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px}
.chk{display:flex;flex-direction:column;gap:6px}
.chk label{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);height:38px;padding:0 14px;border-radius:10px;font-weight:800;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.ghost{background:transparent;border-style:dashed;color:var(--accent);border-color:var(--accent)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--border);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;justify-content:center}
.savebar .st{font-size:12px;color:var(--text2)}
.fu{border-left:4px solid var(--accent);padding:8px 10px;background:var(--surface2);border-radius:8px;margin-top:8px}
.fu .t{font-weight:800}
.fu .m{font-size:12px;color:var(--text2)}
.list-item{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--surface3);cursor:pointer}
.list-item:last-child{border-bottom:none}
.list-item .d{font-weight:900;min-width:74px;font-variant-numeric:tabular-nums}
.list-item .p{flex:1;font-size:13px}
.admin{border:2px dashed var(--accent)}
.lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.lock .in{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:22px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:10px;text-align:center}
.lock .t{font-size:18px;font-weight:900}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#1a1c22;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:700;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
.hint{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:6px 10px;margin-top:8px}
/* 読みもの */
.gsw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gsw button{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px;text-align:left;cursor:pointer}
.gsw button b{display:block;font-size:14.5px}
.gsw button span{font-size:11.5px;color:var(--text2)}
.gsw button.active{border:2px solid var(--accent);background:var(--accent-soft)}
details.ch{border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
details.ch>summary{list-style:none;cursor:pointer;padding:13px 14px;font-weight:800;font-size:14.5px;display:flex;gap:8px;align-items:center}
details.ch>summary::-webkit-details-marker{display:none}
details.ch>summary .n{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
details.ch>summary::after{content:"▼";margin-left:auto;font-size:11px;color:var(--text3)}
details.ch[open]>summary::after{content:"▲"}
.gc{padding:0 14px 14px;font-size:14px}
.gc p,.gc ul,.gc ol{margin:8px 0}
.gc ul,.gc ol{padding-left:20px}
.gc li{margin:4px 0}
.gc h4{font-size:14px;margin:14px 0 4px;padding-left:8px;border-left:3px solid var(--accent)}
.gc .pt{font-size:14.5px;background:var(--accent-soft);border-radius:9px;padding:9px 11px}
.tw{overflow-x:auto;margin:8px 0}
.tw table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
.tw td:first-child,.tw th:first-child{min-width:5.5em}
.tw th,.tw td{border:1px solid var(--border);padding:6px 8px;vertical-align:top;text-align:left}
.tw th{background:var(--surface2);font-size:12px}
.todo{border:1px dashed var(--accent);border-radius:10px;padding:8px 12px;margin-top:10px;background:var(--surface2)}
.todo ul{list-style:none;padding-left:0}
.todo li::before{content:"☐ ";color:var(--accent);font-weight:900}
.dg{border:1px solid var(--border);border-radius:12px;padding:12px;margin:10px 0;background:var(--surface2)}
.dg-t{font-weight:800;margin-bottom:10px}
.tree{display:flex;flex-direction:column;align-items:center;gap:2px}
.tb{border:1.5px solid var(--border);background:#fff;border-radius:9px;padding:7px 12px;text-align:center;min-width:200px;max-width:100%}
.tb b{display:block;font-size:13.5px}.tb span{font-size:11.5px;color:var(--text2)}
.tb.acc,.fb.acc,.cb.acc{border:2px solid var(--accent);background:var(--accent-soft)}
.up{font-size:11px;color:var(--text3);line-height:1.2}
.tr2{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.tr2>div{display:flex;flex-direction:column;align-items:center;gap:2px}
.tr2 .tb{min-width:0;width:100%}
.flow,.cyc{display:flex;flex-wrap:wrap;align-items:stretch;gap:4px}
.fb,.cb{flex:1 1 90px;border:1.5px solid var(--border);background:#fff;border-radius:9px;padding:7px 8px;text-align:center}
.fb small{display:block;font-size:10.5px;font-weight:800;color:var(--accent)}
.fb b,.cb b{display:block;font-size:13px}.fb span,.cb span{font-size:11px;color:var(--text2)}
.fa,.ca{display:flex;align-items:center;color:var(--text3);font-weight:900}
.tip{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.tip .ic{font-size:20px}
.tip .tx{flex:1}
.tip .mo{font-size:11.5px;color:var(--accent);font-weight:800;white-space:nowrap}
.blist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.bl{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--border);border-radius:9px;padding:0 0 0 10px}
.bl:focus-within{border-color:var(--accent);outline:2px solid var(--accent-soft)}
.bl label{font-size:13px;font-weight:800;white-space:nowrap;color:var(--accent);min-width:7.2em}
.bl input{border:none!important;outline:none!important;padding:10px 8px 10px 0;background:transparent}
@media(max-width:480px){.bl{flex-direction:column;align-items:stretch;padding:6px 10px 0}.bl label{min-width:0}.bl input{padding:4px 0 8px}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="lock" class="lock" hidden><div class="in">
  <div class="t">店長日報</div>
  <div class="note" id="lockMsg">店長用のパスワードを入力してください</div>
  <input id="pw" type="password" autocomplete="current-password" aria-label="パスワード">
  <button class="btn pri" id="pwBtn" type="button">開く</button>
  <div id="pwErr" class="note" style="color:var(--crit)" hidden>パスワードが違います</div>
  <button class="btn" type="button" onclick="goHome()">WCSAに戻る</button>
</div></div>

<div id="app">
  <div class="mhead">
    <div class="row">
      <button class="hbtn" type="button" onclick="goHome()" aria-label="WCSAに戻る">🏠</button>
      <span class="title">店長日報</span>
      <div class="seg" id="shopSeg">
        <button data-shop="enya" type="button" onclick="setShop('enya')">本店</button>
        <button data-shop="marco" type="button" onclick="setShop('marco')">マルコ</button>
      </div>
      <span class="spacer"></span>
      <div class="seg" id="viewSeg">
        <button data-view="write" type="button" onclick="setView('write')">書く</button>
        <button data-view="list" type="button" onclick="setView('list')">これまで</button>
        <button data-view="learn" type="button" onclick="setView('learn')">学ぶ</button>
      </div>
    </div>
    <div class="row" style="padding-top:0" id="dateRow">
      <div class="datenav">
        <button class="arw" type="button" onclick="shiftDate(-1)" aria-label="前の日">‹</button>
        <div class="dl" id="dateLabel"></div>
        <button class="arw" type="button" onclick="shiftDate(1)" aria-label="次の日">›</button>
      </div>
      <button class="hbtn" type="button" onclick="goToday()">今日</button>
      <span class="spacer"></span>
      <span class="note" id="authorNote"></span>
    </div>
  </div>
  <div class="body"><div class="wrap" id="main"></div></div>
</div>
<div class="savebar" id="savebar" hidden>
  <span class="st" id="saveSt"></span>
  <button class="btn pri" type="button" id="saveBtn" onclick="saveReport()">日報を送る</button>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== 読みもの：「店づくりの土台」「マーケティングの基本」【追加 R8.11.12】 =====
// 中身を直すときは、この GUIDES の文章を書き換える（html はそのまま画面に表示される）
var GUIDES=[
{id:'base',icon:'🏠',title:'店づくりの土台',sub:'なぜ働くのか、どう働くのか',chapters:[
{id:'words',t:'まず知っておきたい5つの言葉',html:`
<p class="pt">店のお金の流れは、<b>「売上 − 経費 = 利益」</b>の一行で表せます。</p>
<div class="tw"><table><thead><tr><th>言葉</th><th>意味</th><th>例</th></tr></thead><tbody>
<tr><td><b>売上</b></td><td>お客さまに払っていただいたお金の合計。売上 = 客数 × 客単価。「どれだけ選ばれたか」の通知表</td><td>客単価3,000円のお客さまが1日40人なら、売上は12万円</td></tr>
<tr><td><b>経費</b></td><td>店を動かすために使うお金。食材（原価）、人件費、家賃、水道光熱費、消耗品、修理代など</td><td>魚を仕入れる、照明をつける、包丁を研ぐ。すべて経費</td></tr>
<tr><td><b>人件費</b></td><td>働く人に払うお金。時給・給料に加え、社会保険料や交通費も含む。飲食店で一番大きい経費のひとつ</td><td>暇な時間に4人いて、忙しい時間に3人しかいない → 人数ではなくシフトの組み方の問題</td></tr>
<tr><td><b>利益</b></td><td>売上から経費を全部引いて残るお金。店の未来のための費用</td><td>設備の買い替え、昇給、不漁や災害への備えは、ここから出る</td></tr>
<tr><td><b>改善</b></td><td>昨日より少し良くするための、小さな変更を続けること。大きな改革ではない</td><td>洗い場が詰まる → 下げた皿の置き場所を変える → 翌週に詰まりが減ったか見る</td></tr>
</tbody></table></div>
<h4>売上1,000円はどこへ行く？</h4>
<p class="note">一般的な飲食店の目安です。実際の割合は店ごとに違います。自分の店の実際の数字は、日報の「今日の数字」で毎日見られます。</p>
<div class="tw"><table><thead><tr><th>行き先</th><th>目安</th></tr></thead><tbody>
<tr><td>食材（原価）</td><td>約300円</td></tr><tr><td>人件費</td><td>約300円</td></tr><tr><td>家賃</td><td>約100円</td></tr>
<tr><td>水道光熱費・消耗品・修理など</td><td>約200〜250円</td></tr><tr><td><b>利益</b></td><td><b>約50〜100円</b></td></tr></tbody></table></div>
<p>1,000円売っても、手元に残るのは50〜100円ほどです。だから1,000円のロスは、10〜20倍の売上でようやく取り戻せる重さがあります。</p>
<div class="todo"><b>明日からやること</b><ul><li>自分の店の「今日の客数」と「客単価」を、閉店後に一度見る</li><li>捨てた食材があったら、「いくら分か」を一緒に考える</li></ul></div>`},
{id:'why',t:'なぜ働くのか — すべての前提',html:`
<p class="pt">店は、<b>お客さまと、一緒に働く仲間と、その家族の暮らしを良くし続けるため</b>にあります。利益も売上も効率も、すべてそのための手段です。</p>
<div class="dg"><div class="dg-t">毎日の仕事は、すべて「お客さまと仲間の暮らし」につながっている</div>
<div class="tree">
<div class="tb acc"><b>目的：お客さまと仲間の暮らしを良くし続ける</b><span>創業1907年。続くことが、お客さまと地域への約束</span></div><div class="up">▲</div>
<div class="tb"><b>店が続き、良くなる</b><span>給料・設備・品質・不測の備え</span></div><div class="up">▲</div>
<div class="tb"><b>利益が残る</b><span>未来の店のための費用</span></div><div class="up">▲ 売上 − 経費</div>
<div class="tr2"><div><div class="tb"><b>売上・客数を増やす</b><span>お客さまに選ばれた回数</span></div><div class="up">▲</div><div class="tb"><b>マーケティング・接客</b><span>選ばれる理由を作る</span></div></div>
<div><div class="tb"><b>経費のムダを減らす</b><span>届かないお金を人と品質へ</span></div><div class="up">▲</div><div class="tb"><b>効率のよい運営</b><span>段取り・ロス削減・整理整頓</span></div></div></div>
</div><div class="note" style="margin-top:6px">下から上へ「何のために？」をたどると、皿洗いも仕込みも接客も、すべて一番上の目的につながっています。</div></div>
<h4>店は誰のためにあるのか</h4>
<ul><li><b>お客さま</b>：おいしい食事と、楽しい時間。</li><li><b>働く仲間とその家族</b>：給料、安心して働ける場所、成長。</li><li><b>取引先</b>：大洗の漁師さんや仲買さん。私たちが買い続けることで、その仕事も続きます。</li><li><b>地域</b>：大洗に人が来る理由のひとつになります。</li></ul>
<p>どれか一つのために他を犠牲にすると、店は長く続きません。</p>
<h4>続くことが、いちばんの価値</h4>
<p>えんやどっと丸は1907年の清水商店から、100年以上続いてきました。その時々の人たちがお客さまに選ばれ、利益を残し、次の世代に店を渡してきたからです。どんなに良い店でも、つぶれてしまえば誰も幸せにできません。</p>
<h4>「なぜ」をたどる</h4>
<div class="tw"><table><thead><tr><th>問い</th><th>答え</th><th>もう一段深く</th></tr></thead><tbody>
<tr><td>なぜ利益が必要か</td><td>店を続けるため。物価は上がり、設備は古くなり、不漁や災害も来る</td><td>利益は「未来の店のための費用」。今日の利益が、来年の給料や新しい冷蔵庫になる</td></tr>
<tr><td>なぜ売上・客数を増やすのか</td><td>経費を削るのには限界があるが、売上には上限がない</td><td>売上は「お客さまからの評価の合計」、客数は「選ばれた回数」。数字は、お客さまの声を数えたもの</td></tr>
<tr><td>なぜ経費を抑えるのか</td><td>誰にも届かないお金を減らすため</td><td>捨てた食材、消し忘れの電気、ムダな残業は、お客さまにも仲間にも届かない。浮いたお金は給料と品質に回せる</td></tr>
<tr><td>なぜ効率よく働くのか</td><td>時間も限りある経費だから</td><td>探し物や二度手間が減れば、お客さまに向き合う時間と、早く帰れる時間が増える</td></tr>
<tr><td>なぜマーケティングが大事か</td><td>選ばれる理由を、偶然ではなく仕組みにするため</td><td>値下げや無理な長時間労働で客を集めると、忙しいのに誰も報われない</td></tr>
</tbody></table></div>
<h4>具体例で考える</h4>
<ol><li><b>食材を1,000円分捨てた</b>：仮に利益率5%なら、取り戻すには売上2万円が必要です。客単価3,000円なら、お客さま約7人分の会計が消えたのと同じです。</li>
<li><b>1日あと5人来てくれた</b>：仮に客単価3,000円なら、月に約45万円の売上増です。その一部が、賞与や新しい道具になります。</li>
<li><b>真夏に冷蔵庫が壊れた</b>：まとまった修理代をすぐに出せるのは、利益を残してきた店だけです。残していなければ、借金するか営業を止めるしかありません。</li></ol>
<h4>利益のために削ってはいけないもの</h4>
<p>鮮度と味、食の安全、お客さまへの誠実さ、働く人の健康と法令順守。この4つを削ると客数が落ち、結局は利益も失います。経費を抑えるとは、<b>ここ以外のムダ</b>を減らすことです。</p>`},
{id:'run',t:'お店が回るコツ',html:`
<p class="pt"><b>営業中の出来は、開店前の準備でほぼ決まります。</b>忙しい時間に考えたり探したりしなくていい状態を、先に作っておきます。</p>
<div class="tw"><table><thead><tr><th>コツ</th><th>こうする</th><th>例</th></tr></thead><tbody>
<tr><td>準備が8割</td><td>ピークの前に仕込み・補充・備品を終える</td><td>ランチ前に、渡し皿やカトラリーを満杯にしておく</td></tr>
<tr><td>決めごとは書いて貼る</td><td>「人に聞かないと分からないこと」を減らす</td><td>開店・閉店の手順をキッチンの壁に1枚で貼る</td></tr>
<tr><td>置き場所を決める</td><td>「探す」時間をゼロにする（整理・整頓）</td><td>使ったら戻す場所に、テープで印をつける</td></tr>
<tr><td>報告・連絡・相談は早く</td><td>悪い知らせほど先に伝える</td><td>「アジがあと3つです」を、切れる前に言う</td></tr>
<tr><td>声に出して共有</td><td>注文・提供・切れを復唱する</td><td>「3番卓、おまかせ2つ入ります」「はい、おまかせ2つ」</td></tr>
</tbody></table></div>
<div class="todo"><b>明日からやること</b><ul><li>開店前に「今日の予約数・おすすめ・切れそうな物」を3分で共有する</li><li>探し物をしたら、その場で置き場所を決める</li><li>困ったことは、その日のうちに店長に伝える</li></ul></div>`},
{id:'team',t:'仲間との人間関係',html:`
<p class="pt"><b>雰囲気のいい店は、お客さまにも伝わります。</b>厨房とホールがギスギスしていれば、それは料理の味と接客に出ます。</p>
<ul><li><b>挨拶は自分から</b>：「おはようございます」「お疲れさまでした」を、相手の目を見て言う。</li>
<li><b>「ありがとう」を言葉にする</b>：助けてもらったら、その場で一言。当たり前のことほど口に出す。</li>
<li><b>人ではなく、仕組みを責める</b>：ミスが起きたら「誰がやった」より「どうすれば起きないか」を話す。</li>
<li><b>陰口は言わない、聞かない</b>：不満は本人か店長に直接伝える。陰口は店全体の信頼を削ります。</li>
<li><b>忙しいときこそ声をかける</b>：「手伝います」「洗い物やります」の一言が、ピークを乗り切る力になります。</li></ul>
<p><b>例</b>：新人がお皿を割ったとき。「何やってるの」ではなく「ケガはない？」と声をかけ、後で「重ね方を変えようか」と仕組みを直す。その人は次から失敗を隠さなくなります。</p>
<div class="todo"><b>明日からやること</b><ul><li>今日助けてくれた人に、帰る前に「ありがとう」を言う</li><li>ミスの話をするときは、「次はどうするか」で終わらせる</li></ul></div>`},
{id:'guest',t:'お客さまとの接し方',html:`
<p class="pt"><b>お客さまが覚えているのは、「最初の10秒」と「最後の10秒」です。</b>ここで印象のほとんどが決まります。</p>
<div class="dg"><div class="dg-t">お客さまの印象は、最初と最後で決まる</div>
<div class="flow"><div class="fb acc"><small>最初の10秒</small><b>入店</b><span>すぐに目と声を向ける</span></div><div class="fa">›</div>
<div class="fb"><b>ご案内</b><span>席まで笑顔で</span></div><div class="fa">›</div>
<div class="fb"><b>ご注文</b><span>おすすめを一つ伝える</span></div><div class="fa">›</div>
<div class="fb"><b>ご提供</b><span>一皿の物語を一言添える</span></div><div class="fa">›</div>
<div class="fb acc"><small>最後の10秒</small><b>お会計</b><span>目を見てありがとう</span></div><div class="fa">›</div>
<div class="fb acc"><small>最後の10秒</small><b>お見送り</b><span>またお待ちしています</span></div></div></div>
<ul><li><b>最初の10秒</b>：入口を見て、すぐに「いらっしゃいませ」。手が離せなくても、目と声だけは向ける。</li>
<li><b>一言添える</b>：料理を出すときに「今朝大洗港で揚がったヒラメです」など、その一皿の物語を一つ。</li>
<li><b>名前と好みを覚える</b>：常連さんに「いつもの、ご飯少なめですね」。覚えてもらえていることが、また来る理由になります。</li>
<li><b>断るときは代わりを出す</b>：「それは切れています」で終わらせず、「代わりに今日は○○がおすすめです」。</li>
<li><b>最後の10秒</b>：会計のあとに「またお待ちしています」。できれば入口まで見送る。</li></ul>
<h4>ご意見・苦情は「贈り物」</h4>
<p>不満を口にしてくれるお客さまは、まだ店に期待してくれています。何も言わずに来なくなる方が、ずっと怖いことです。対応はいつも同じ順番で行います。</p>
<ol><li><b>まず謝る</b>：不快な思いをさせたことに対して。言い訳はしない。</li><li><b>最後まで聞く</b>：途中で遮らず、うなずきながら。</li><li><b>すぐに対処する</b>：自分で判断できなければ、すぐ店長を呼ぶ。</li><li><b>お礼を言う</b>：「教えていただき、ありがとうございます」。</li><li><b>店で共有する</b>：その日のうちに伝え、同じことが起きないように仕組みを直す。</li></ol>
<div class="todo"><b>明日からやること</b><ul><li>料理を出すときに、一皿につき一言を添える</li><li>常連さんの名前と好みを、1人覚える</li></ul></div>`},
{id:'staff',t:'スタッフとの向き合い方（店長向け）',html:`
<p class="pt"><b>店長の仕事は、自分が一番働くことではなく、スタッフが力を出せる状態を作ることです。</b></p>
<div class="tw"><table><thead><tr><th>場面</th><th>こうする</th><th>なぜ</th></tr></thead><tbody>
<tr><td>指示するとき</td><td>「何を」だけでなく「なぜ」も伝える</td><td>理由が分かれば、自分で判断できるようになる</td></tr>
<tr><td>褒めるとき</td><td>みんなの前で、具体的に</td><td>「いいね」より「さっきのお客さまへの一言、良かった」の方が、何を続ければいいか伝わる</td></tr>
<tr><td>注意するとき</td><td>一対一で、人ではなく行動について</td><td>人前で叱ると、反省より恥じが残る</td></tr>
<tr><td>任せるとき</td><td>任せたら口を出しすぎず、終わったら一緒に振り返る</td><td>小さな失敗を経験しないと、人は育たない</td></tr>
<tr><td>話を聞くとき</td><td>月に一度、5分でも一対一で話す時間を作る</td><td>辞める人の多くは、不満を言う場所がなかった人</td></tr>
</tbody></table></div>
<p><b>守るべきこと</b>：えこひいきをしない。休憩と休日を確実に取らせる。労働時間は正しく記録する。仲間の健康と生活を守ることは、店を守ることと同じです。</p>
<div class="todo"><b>明日からやること</b><ul><li>今日良かったスタッフの行動を1つ、具体的に褒める</li><li>今月中に、全員と5分ずつ一対一で話す</li></ul></div>`},
{id:'kaizen',t:'店をさらに良くする習慣',html:`
<p class="pt"><b>店は、大きな改革よりも、小さな改善の積み重ねで良くなります。</b>「気づく→考える→一つ変える→確かめる」を、毎日・毎週・毎月の習慣にします。日報の「改善提案」は、この①〜③を書く場所です。</p>
<div class="dg"><div class="dg-t">小さな改善を、何度も回す</div>
<div class="cyc"><div class="cb acc"><b>① 気づく</b><span>終礼で「困った」を出す</span></div><div class="ca">→</div><div class="cb"><b>② 考える</b><span>なぜ起きたかを話す</span></div><div class="ca">→</div><div class="cb"><b>③ 一つ変える</b><span>やり方を一つだけ変える</span></div><div class="ca">→</div><div class="cb"><b>④ 確かめる</b><span>翌週、良くなったか見る</span></div><div class="ca">↺</div></div></div>
<div class="tw"><table><thead><tr><th>いつ</th><th>やること</th><th>時間</th></tr></thead><tbody>
<tr><td>毎日（終礼）</td><td>一人ずつ「今日良かったこと」と「困ったこと」を1つずつ言う</td><td>5分</td></tr>
<tr><td>毎日</td><td>客数・売上・捨てた食材を記録する（日報）</td><td>3分</td></tr>
<tr><td>毎週</td><td>「困ったこと」の中から1つ選び、直し方を決めて試す</td><td>15分</td></tr>
<tr><td>毎月</td><td>数字とお客さまの声を振り返り、来月の重点を1つ決める</td><td>30分</td></tr>
<tr><td>時々</td><td>他の店に食べに行き、「うちでもできること」を1つ持ち帰る</td><td>—</td></tr>
</tbody></table></div>
<p><b>例</b>：終礼で「ピーク時におしぼりが足りなくなる」という声が3日続いた。→ 週の改善で「開店前に2倍分準備する」と決める。→ 翌週、足りなくなったか確かめる。これだけで、その分のバタバタが消えます。</p>
<div class="todo"><b>明日からやること</b><ul><li>終礼で「良かったこと・困ったこと」を一人1つずつ言う</li><li>「困ったこと」は日報の改善提案に書き、週に1つだけ直す</li></ul></div>`}
]},
{id:'mkt',icon:'📈',title:'マーケティングの基本',sub:'選ばれる理由を、仕組みにする',chapters:[
{id:'what',t:'マーケティングとは何か',html:`
<p class="pt">マーケティングとは、<b>「誰に・何を・どう届けて・また来てもらうか」を決め、それを数字で直し続ける仕組み</b>です。宣伝やSNS投稿は、その最後の一部にすぎません。</p>
<ul><li>目指すのは「売り込まなくても選ばれる状態」です。</li><li>なぜ売上や利益が大事なのかは、「店づくりの土台」の「なぜ働くのか」を先に読んでください。</li></ul>
<div class="dg"><div class="dg-t">利益は目的ではなく、店を続けて良くするための燃料</div>
<div class="cyc"><div class="cb"><b>マーケティング</b><span>選ばれる理由を作る</span></div><div class="ca">→</div><div class="cb"><b>客数・売上が増える</b><span>売上 = 客数 × 客単価</span></div><div class="ca">→</div><div class="cb acc"><b>利益が残る</b><span>売上 − 経費</span></div><div class="ca">→</div><div class="cb"><b>再投資</b><span>給料・設備・品質・備え</span></div><div class="ca">→</div><div class="cb"><b>店の価値が上がる</b><span>料理・接客・働きやすさ</span></div><div class="ca">↺</div></div></div>`},
{id:'steps',t:'体系：6つの段階（重要度の高い順）',html:`
<p class="pt">順番が大事です。①〜④が固まっていないうちに⑤の宣伝を強めても、お金と時間が漏れます。</p>
<div class="tw"><table><thead><tr><th>段階</th><th>やること</th><th>なぜ大事か</th></tr></thead><tbody>
<tr><td>① 顧客理解</td><td>お客さんが片づけたい「用事」を知る。例：「大洗で本物の魚を失敗せず食べたい」</td><td>ここを外すと、後の施策がすべて的外れになる。いちばん安く、いちばん効く</td></tr>
<tr><td>② STP</td><td>客層を分け（S）、狙う層を絞り（T）、「○○ならうち」と一言で言える立ち位置を決める（P）</td><td>小さな店は資本で勝てない。絞るほど覚えてもらいやすい</td></tr>
<tr><td>③ 4P</td><td>商品・価格・提供方法・伝え方を②と矛盾なくそろえる</td><td>「高級鮨」を名乗りながら紙皿では、お客さんは混乱する</td></tr>
<tr><td>④ リピート（LTV）</td><td>「また来る理由」を設計する。季節の品、名前を覚える接客、次回予約の導線</td><td>新規客を獲るには、既存客を維持する何倍もの費用がかかる（よく「5倍」と言われる経験則）</td></tr>
<tr><td>⑤ 認知・集客</td><td>Googleマップ、口コミ、Instagram、紹介で知らせる</td><td>①〜④が固まっていれば、事実を見せるだけで効く</td></tr>
<tr><td>⑥ 計測・改善</td><td>客数・客単価・リピート率・「どこで知ったか」の4つを見る</td><td>測らないものは直せない。勘が当たっているかを確かめる唯一の手段</td></tr>
</tbody></table></div>
<p>⑥で分かったことは①に戻ります。<b>知る → 決める → 作る → 続けてもらう → 知らせる → 測る → また知る</b>、という循環です。</p>`},
{id:'shops',t:'各店への当てはめ',html:`
<p class="pt">3つの事業は、お客さんも段階も違うため、力を入れる段階も違います。</p>
<h4>本店（えんやどっと丸）：鮨を主役にする</h4>
<ul><li><b>① 用事</b>：観光客は「大洗でしか食べられない魚を、失敗せず食べたい」。</li><li><b>② 立ち位置</b>：「大洗港の朝獲れを、カウンターのおまかせで」と一言で言えるようにする。</li><li><b>③ 4P</b>：品書きに産地と漁港名を書く。おまかせの価格帯を明確にする。カウンターを主役にする。</li><li><b>⑥ 計測</b>：平日のおまかせの出数と客単価を週ごとに追う。</li></ul>
<h4>パスタのマルコ：開店1年目</h4>
<ul><li><b>⑤ を優先</b>：まだ知られていない段階。Googleマップの写真・営業時間・口コミへの返信を最優先にする。</li><li><b>④ も同時に</b>：初来店のお客さんに「次はこれを食べに来て」と言える季節の一皿を用意する。</li><li><b>物販</b>：「店で食べた味を家で再現したい」という用事を満たし、来店と来店の間もお店とつながる装置になる。</li></ul>
<h4>FishHack：飲食店向けの卸売（B2B）</h4>
<ul><li><b>① 用事</b>：仕入れ担当者は「鮮度が安定した魚を、手間なく、少量でも欲しい」。</li><li><b>② 立ち位置</b>：「大洗港から、本店と同じ目利きで届ける」。自社の店が実例になるのが強み。</li><li><b>営業の流れ</b>：見込み客のリスト化 → 試食サンプル → 少量の定期便 → 定期便の拡大。継続率がそのままLTVになる。</li></ul>`},
{id:'pros',t:'メリット・デメリットと落とし穴',html:`
<p class="pt">体系的に進めると無駄は減りますが、考えること自体が目的になる危険もあります。</p>
<div class="tw"><table><thead><tr><th>メリット</th><th>デメリット</th></tr></thead><tbody>
<tr><td>施策の優先順位がつき、お金と時間を無駄にしにくい</td><td>分析に時間をかけすぎると、動きが遅くなる</td></tr>
<tr><td>店長同士で判断基準を共有できる</td><td>枠組みを埋めること自体が目的になりやすい</td></tr>
<tr><td>失敗したとき、どこが悪かったか特定できる</td><td>数字を取る手間が現場の負担になる</td></tr></tbody></table></div>
<h4>落とし穴</h4>
<ul><li><b>力の分散</b>：3事業はそれぞれ顧客も立ち位置も違う。全部を同じ熱量でやると、どれも中途半端になりやすい。</li><li><b>SNSへの偏り</b>：飲食店の来店のきっかけは、Googleマップ検索の方が大きいことが多い。投稿が来店に結びついているか確かめる。</li><li><b>「どこで知ったか」を取っていない</b>：これが分からないと、⑤と⑥が勘頼みになる。</li></ul>
<p><b>より早い始め方</b>：枠組みを全部埋めるより、既存のお客さま10人に「なぜ来たか、何が良かったか」を聞く方が早くて正確です。答えの中に①と②の答えがほぼ入っています。</p>`},
{id:'todo',t:'実践チェックリスト',html:`
<p class="pt">まずは数字とお客さまの声を集めることから始めます。</p>

<script>
var firebaseConfig={apiKey:"AIzaSyA3YVQwyAudMEZJs_rfEW8IHfxh4Grvlbw",authDomain:"wcsa-shift.firebaseapp.com",databaseURL:"https://wcsa-shift-default-rtdb.firebaseio.com",projectId:"wcsa-shift",storageBucket:"wcsa-shift.firebasestorage.app",messagingSenderId:"521554404721",appId:"1:521554404721:web:f59a570dd7e10f3aed82d0"};

// ===== ユーティリティ =====
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function yen(v){return v==null||isNaN(v)?'—':(v<0?'−':'')+'¥'+Math.round(Math.abs(v)).toLocaleString()}
function pct(v,s){return v==null||!(s>0)?'—':(v/s*100).toFixed(1)+'%'}
function pad(n){return String(n).padStart(2,'0')}
function dKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}       // シフト用 YYYY-MM-DD
function k8(ds){return ds.replace(/-/g,'')}                                                    // 売上・日報用 YYYYMMDD
function addDays(ds,n){var p=ds.split('-').map(Number);var d=new Date(p[0],p[1]-1,p[2]+n);return dKey(d)}
function defaultDate(){var t=new Date();if(t.getHours()<5)t.setDate(t.getDate()-1);return dKey(t)}   // 深夜0〜5時は前日の日報
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on')},2600)}
function goHome(){try{if(window.parent&&window.parent!==window&&typeof window.parent.switchMode==='function'){window.parent.switchMode('shift');return}}catch(e){}location.href='./'}
function isAdmin(){try{return !!(window.parent&&window.parent!==window&&window.parent.adminUnlocked)}catch(e){return false}}
async function sha(t){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0')}).join('')}
function once(path){return db?db.ref(path).once('value').then(function(s){return s.val()}).catch(function(){return null}):Promise.resolve(null)}
function segActive(id,attr,val){document.querySelectorAll('#'+id+' button').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-'+attr)===val)})}

// ===== 起動・ロック =====
function boot(){
  var q=new URLSearchParams(location.search);
  var s=q.get('shop')||localStorage.getItem('nippo_shop')||'enya'; if(!SHOP[s])s='enya';

function applyTheme(){var S=SHOP[state.shop];document.documentElement.style.setProperty('--accent',S.accent);document.documentElement.style.setProperty('--accent-soft',S.soft)}

  state.shop=s;localStorage.setItem('nippo_shop',s);state.dirty=false;applyTheme();segActive('shopSeg','shop',s);checkLock()}
function setView(v){if(state.dirty&&v!=='write'&&!confirm('保存していない入力があります。移動しますか？'))return;state.view=v;segActive('viewSeg','view',v);load()}
function shiftDate(n){if(state.dirty&&!confirm('保存していない入力があります。日付を変えますか？'))return;state.date=addDays(state.date,n);state.dirty=false;state.view='write';segActive('viewSeg','view','write');load()}
function goToday(){if(state.dirty&&!confirm('保存していない入力があります。移動しますか？'))return;state.date=defaultDate();state.dirty=false;state.view='write';segActive('viewSeg','view','write');load()}
function renderDateLabel(){var p=state.date.split('-').map(Number),d=new Date(p[0],p[1]-1,p[2]);var t=defaultDate();
  $('dateLabel').innerHTML=(p[1])+'月'+p[2]+'日（'+DOW[d.getDay()]+'）<small>'+(state.date===t?'今日の日報':state.date<t?'過去の日報':'未来の日付')+'</small>'}

// ===== 読み込み =====

  var S=SHOP[state.shop], k=k8(state.date), pk=k8(addDays(state.date,-7));

  ]);
  state.calcIn={m:res[0],pm:res[1],rates:res[2],sd:res[3],psd:res[4],shift:res[5],mtd:res[8],marcoAll:res[9],fh:res[10],pfh:res[11],k:k};

// ===== FishHackの売上（FishHackアプリの納品データから直接）【追加 R8.11.13】 =====
// 計算は日別人件費（labor.html の loadFishHack）と同じ：伝票ごとに税率別に端数切り捨て。Excel取込分は除く
var FH_DB='https://fishhack-74de3-default-rtdb.asia-southeast1.firebasedatabase.app';
async function fetchFH(ds){
  var q=FH_DB+'/fishhack/deliveries.json?orderBy='+encodeURIComponent('"date"')+'&equalTo='+encodeURIComponent('"'+ds+'"');
  var data=null;
  try{var r=await fetch(q);if(r.ok)data=await r.json()}catch(e){}
  if(data==null){try{var r2=await fetch(FH_DB+'/fishhack/deliveries.json');if(r2.ok)data=await r2.json()}catch(e){}}   // 索引がない場合は全件から探す（日別人件費と同じ）
  if(data==null)return null;
  var net=0,gross=0,n=0,num=function(v){v=+v;return isNaN(v)?0:v};
  Object.keys(data).forEach(function(k){var d=data[k];if(!d||d.source==='excel'||String(d.date)!==ds)return;
    var nt=0,t8=0,t10=0;(d.items||[]).forEach(function(it){var t=it.total!=null?Math.floor(num(it.total)):Math.floor(num(it.qty)*num(it.price)-num(it.disc));nt+=t;if(+it.tax===8)t8+=t;else t10+=t});
    net+=nt;gross+=nt+Math.floor(t8*0.08)+Math.floor(t10*0.10);n++});
  return {net:net,gross:gross,n:n};
}

// 即時反映：FishHackのデータベースを購読し、納品が入ったら数字の欄だけ描き直す（入力中の日報は消えない）
var fhApp=null, fhRef=null;
function sumFH(data,ds){var net=0,gross=0,n=0,num=function(v){v=+v;return isNaN(v)?0:v};
  Object.keys(data||{}).forEach(function(k){var d=data[k];if(!d||d.source==='excel'||String(d.date)!==ds)return;
    var nt=0,t8=0,t10=0;(d.items||[]).forEach(function(it){var t=it.total!=null?Math.floor(num(it.total)):Math.floor(num(it.qty)*num(it.price)-num(it.disc));nt+=t;if(+it.tax===8)t8+=t;else t10+=t});
    net+=nt;gross+=nt+Math.floor(t8*0.08)+Math.floor(t10*0.10);n++});
  return {net:net,gross:gross,n:n}}
function watchFH(ds){
  if(fhRef){try{fhRef.off()}catch(e){}fhRef=null}
  if(state.shop!=='enya'||typeof firebase==='undefined')return;
  try{
    if(!fhApp)fhApp=firebase.apps.filter(function(a){return a.name==='fishhack'})[0]||firebase.initializeApp({databaseURL:FH_DB},'fishhack');
    fhRef=fhApp.database().ref('fishhack/deliveries').orderByChild('date').equalTo(ds);
    fhRef.on('value',function(snap){
      if(state.view!=='write'||state.date!==ds||state.shop!=='enya'||!state.calcIn)return;
      var v=sumFH(snap.val(),ds); var old=state.calcIn.fh;
      if(old&&old.net===v.net&&old.gross===v.gross&&old.n===v.n)return;
      state.calcIn.fh=v; state.nums=calcNums(state.calcIn);
      var box=$('numsBox'); if(box){box.innerHTML=numsHTML(); toast('FishHackの売上を更新しました');}
    });
  }catch(e){console.warn('FishHackの購読に失敗',e)}
}

// ===== 数字の計算 =====
// 確定：日別人件費ページが保存した nippo_metrics（打刻と台帳から計算）
// 見込み：売上はPOSのCSV（sales_daily）、人件費はシフト予定の時間×直近28日の1時間あたり人件費、食材費は売上×原価率、固定費は月の固定費の日割り
function salesFrom(sd,tax){if(!sd)return null;if(sd.sales!=null)return +sd.sales;return +(tax==='税込'?sd.gross:sd.net)}
function shiftHours(sh){
  if(!sh)return null;var by={};
  ['before','lunch','dinner'].forEach(function(k){(sh[k]||[]).forEach(function(p){if(!p||!p.name||!p.start||!p.end)return;
    var a=toMin(p.start),b=toMin(p.end);if(b<=a)b+=1440;var x=by[p.name];if(!x)by[p.name]={a:a,b:b};else{x.a=Math.min(x.a,a);x.b=Math.max(x.b,b)}})});
  var names=Object.keys(by);if(!names.length)return null;
  var h=0;names.forEach(function(n){var m=(by[n].b-by[n].a)/60;h+=m-(m>8?1:m>6?0.75:0)});   // 休憩：6時間超45分・8時間超1時間
  return {h:h,n:names.length};
}
function toMin(t){var p=String(t).split(':');return (+p[0])*60+(+p[1]||0)}
function calcNums(o){
  var r=o.rates||{}, tax=r.tax||'税抜', m=o.m||null, N={tax:tax,flags:{}};
  // 売上・客数
  var s=salesFrom(o.sd,tax), est=false;
  if(s==null&&state.shop==='marco'&&o.mtd&&o.mtd.asOf===o.k&&o.marcoAll){
    var pre=o.k.slice(0,6),other=0;Object.keys(o.marcoAll).forEach(function(kk){var v=o.marcoAll[kk];if(kk.indexOf(pre)===0&&kk!==o.k&&v&&!v.est)other+=salesFrom(v,tax)||0});
    var tot=+(tax==='税込'?o.mtd.gross:o.mtd.net)-other; if(tot>0){s=tot;est=true}
  }
  if(s==null&&m&&m.s!=null)s=m.s;
  N.S=s; N.salesEst=est; N.cust=o.sd&&o.sd.cust?+o.sd.cust:null;
  var fhLive=o.fh?(tax==='税込'?o.fh.gross:o.fh.net):null;
  N.fhs=m&&m.fhs!=null?m.fhs:(fhLive||0); N.fhN=o.fh?o.fh.n:null;
  // 人件費
  if(m&&m.l!=null&&(m.l>0||m.h>0)){N.L=m.l;N.flags.L='確定';N.H=m.h}
  else{var sh=shiftHours(o.shift);if(sh&&r.lph){N.L=sh.h*r.lph;N.H=sh.h;N.flags.L='見込み';N.staff=sh.n}else{N.L=null;N.flags.L=sh?'率なし':'シフトなし'}}
  // 食材費
  if(m&&m.f!=null){N.F=m.f;N.flags.F=m.prov?'仮':'確定'}
  else if(s!=null&&r.foodRate!=null){N.F=s*r.foodRate+(N.fhs*(r.fhRate||0));N.flags.F='見込み'}
  else N.F=null;
  // 固定費
  if(m&&m.x!=null){N.X=m.x;N.flags.X=m.prov?'仮':'確定'}
  else{var fd=r.fixedDay&&r.fixedDay[o.k.slice(0,6)];N.X=fd!=null?fd:null;N.flags.X=fd!=null?'日割り':null}
  var SS=(N.S||0)+N.fhs;
  N.SS=SS; N.O=(N.S!=null&&N.L!=null&&N.F!=null&&N.X!=null)?SS-N.L-N.F-N.X:null;
  N.avg=N.S!=null&&N.cust?N.S/N.cust:null;
  N.prodH=N.H>0&&N.S!=null?SS/N.H:null;
  // 先週の同じ曜日
  var pm=o.pm||null, ps=salesFrom(o.psd,tax); if(ps==null&&pm&&pm.s!=null)ps=pm.s;
  var pfh=pm&&pm.fhs!=null?pm.fhs:(o.pfh?(tax==='税込'?o.pfh.gross:o.pfh.net):null);
  N.P={S:ps,fhs:pfh,cust:o.psd&&o.psd.cust?+o.psd.cust:null,L:pm?pm.l:null,O:(pm&&pm.s!=null&&pm.l!=null&&pm.f!=null&&pm.x!=null)?(pm.s+(pm.fhs||0))-pm.l-pm.f-pm.x:null,SS:ps!=null?ps+(pfh||0):null};
  N.ratesAt=r.at||null; N.noMetrics=!o.rates;
  return N;
}

// ===== 前回までの提案（振り返り） =====
function collectFollowups(all){
  var out=[];Object.keys(all).sort().reverse().forEach(function(k){var r=all[k];if(!r||!r.proposals)return;
    (Array.isArray(r.proposals)?r.proposals:Object.values(r.proposals)).forEach(function(p,i){if(p&&p.title&&OPEN_ST[p.status||'提案'])out.push({k:k,i:i,p:p})})});
  return out.slice(0,8);
}

// ===== 書く画面 =====
function flagChip(f){if(!f)return '';var c=f==='確定'?'ok':f==='見込み'||f==='日割り'?'a':'w';return '<span class="chip '+c+'">'+esc(f)+'</span>'}
function diffTxt(c,p){if(c==null||p==null||!(p>0))return '';var d=(c/p*100-100);return '<span style="color:'+(d>=0?'var(--ok)':'var(--crit)')+'">先週比 '+(d>=0?'+':'')+d.toFixed(1)+'%</span>'}
function numsHTML(){
  var N=state.nums, S=SHOP[state.shop];
  if(!N)return '';
  var noSales=N.S==null;
  var card=function(cls,lb,flag,v,sub){return '<div class="kc '+(cls||'')+'"><div class="kl">'+lb+' '+flagChip(flag)+'</div><div class="kv'+(cls==='op'&&v!=='—'?(N.O>=0?' pos':' neg'):'')+'">'+v+'</div><div class="ks">'+(sub||'')+'</div></div>'};
  var h='<div class="card"><h2>📊 今日の数字 <span class="note" style="font-weight:500">自動で入ります</span></h2>';
  h+='<div class="kgrid">';
  var isH=state.shop==='enya', base=isH?'合計売上比':'売上比';
  if(isH){
    h+=card('', '本店売上（'+esc(N.tax)+'）', null, yen(N.S), diffTxt(N.S,N.P.S));
    h+=card('', 'FishHack売上', null, yen(N.fhs), (N.fhN!=null?'納品 '+N.fhN+'件　':'')+diffTxt(N.fhs,N.P.fhs));
    h+=card('total', '合計売上', null, N.S==null&&!N.fhs?'—':yen(N.SS), '本店＋FishHack　'+diffTxt(N.S!=null?N.SS:null,N.P.SS));
  }else{
    h+=card('', '売上（'+esc(N.tax)+'）', N.salesEst?'推定':null, yen(N.S), diffTxt(N.S,N.P.S));
  }

// ===== Musubuチャットへ自動共有【追加 R8.11.12】 =====
// 送る内容：①新しい改善提案の要約 ②代表の判断（採用・保留・見送り）③振り返りで「効果あり／効果なし」になった結果
// 数字（売上・人件費など）はチャットに出さない。Musubuの形式：stock/{enya|marco}/chat/{key} = {id,user,text,time,ts,_r,pinned}
var CHAT_USER='📝 日報';
function cut(t,n){t=String(t||'').replace(/\s+/g,' ').trim();if(!t)return '';var ix=t.indexOf('。'),f=ix>=0?t.slice(0,ix+1):t;if(f.length>=8&&f.length<t.length&&f.length<=n)t=f;return t.length>n?t.slice(0,n-1)+'…':t}
function dLabel(k){return (+k.slice(4,6))+'/'+(+k.slice(6,8))}
function summarize(p,author,k){
  var lines=['💡 改善提案｜'+SHOP[state.shop].name+' '+dLabel(k)+(author?'（'+author+'）':'')];
  [['title','テーマ'],['problem','何が起きたか'],['cause','なぜ'],['idea','どう変えるか'],['effect','期待する効果'],['who','誰が・いつから']].forEach(function(x){if(p[x[0]]){var t=String(p[x[0]]).replace(/\s+/g,' ').trim();lines.push('・'+x[1]+'：'+(t.length>80?t.slice(0,79)+'…':t))}});
  if(p.needDecision)lines.push('（代表の判断待ち）');
  return lines.join('\n');
}
var DEC_ICON={'採用・試行中':'✅ 採用','保留':'⏸ 保留','見送り':'🙏 見送り','効果あり（定着）':'🎉 効果あり','効果なし（やめる）':'🔁 効果なし'};
function chatMsg(text){var d=new Date();var key=db.ref('stock/'+state.shop+'/chat').push().key;
  return {key:key,data:{id:key,user:CHAT_USER,text:text,time:d.getHours()+':'+pad(d.getMinutes()),ts:Date.now(),_r:false,pinned:false,src:'nippo'}}}
function buildChatPosts(props,author,fuUpd){
  var w={},n=0,k=k8(state.date),base='stock/'+state.shop+'/chat/';
  var orig=(state.report&&state.report.proposals&&(Array.isArray(state.report.proposals)?state.report.proposals:Object.values(state.report.proposals)))||[];
  props.forEach(function(p,i){
    if(p.share===false||!p.title||!p.idea)return;
    var text=summarize(p,author||(state.report&&state.report.author)||'',k);
    if(!p.chatKey){var m=chatMsg(text);w[base+m.key]=m.data;p.chatKey=m.key;p.chatSig=text;n++}
    else if(p.chatSig!==text){w[base+p.chatKey+'/text']=text;w[base+p.chatKey+'/edited']=true;p.chatSig=text}
    // 代表の判断が変わったら一言共有
    var st=p.status||'提案';
    if(state.admin&&st!=='提案'&&DEC_ICON[st]&&p.decPosted!==st){
      var m2=chatMsg(DEC_ICON[st]+'｜「'+cut(p.title,30)+'」'+(p.decisionNote?'\n代表：'+cut(p.decisionNote,60):''));w[base+m2.key]=m2.data;p.decPosted=st;n++}
  });
  // 振り返りで結果が出た提案
  state.followups.forEach(function(f){
    var sk='nippo/'+state.shop+'/'+f.k+'/proposals/'+f.i+'/';
    var st=fuUpd[sk+'status'];if(!st||st===f.p.status||!/効果/.test(st)||f.p.decPosted===st||f.p.share===false)return;
    var rs=fuUpd[sk+'result']!=null?fuUpd[sk+'result']:f.p.result;
    var m=chatMsg(DEC_ICON[st]+'｜'+SHOP[state.shop].name+' '+dLabel(f.k)+'の提案「'+cut(f.p.title,30)+'」'+(rs?'\n結果：'+cut(rs,60):''));
    w[base+m.key]=m.data;w[sk+'decPosted']=st;n++;
  });
  return {writes:w,n:n};
}

    h+='<div class="list-item" onclick="openDate(\''+k+'\')"><div class="d">'+(+k.slice(4,6))+'/'+(+k.slice(6,8))+'（'+DOW[d.getDay()]+'）<div class="note">'+esc(r.author||'')+'</div></div><div class="p">'+
      (r.alert?'<div><span class="chip c">要連絡</span> '+esc(r.alert.slice(0,40))+'</div>':'')+
      (ps.length?ps.map(function(p){return '<div>💡 '+esc(p.title||'（タイトルなし）')+' <span class="chip a">'+esc(p.status||'提案')+'</span>'+(p.needDecision&&(p.status||'提案')==='提案'?' <span class="chip w">判断待ち</span>':'')+'</div>'}).join(''):'<div class="note">提案なし</div>')+
      (r.snap&&r.snap.S!=null?'<div class="note">売上 '+yen(r.snap.S)+(r.snap.O!=null?'　営業利益 '+yen(r.snap.O):'')+'</div>':'')+
      (r.ownerComment?'<div class="note" style="color:var(--ok)">📝 代表から返信あり</div>':'')+
      '</div></div>'});
  h+='</div>';
  if(state.admin)h+=adminCfgHTML();
  $('main').innerHTML=h;
}
function openDate(k){state.date=k.slice(0,4)+'-'+k.slice(4,6)+'-'+k.slice(6,8);state.view='write';segActive('viewSeg','view','write');load()}

// ===== 学ぶ（店づくりの土台・マーケティングの基本） =====
function todayTip(){var p=state.date.split('-').map(Number);var n=Math.floor(Date.UTC(p[0],p[1]-1,p[2])/864e5);return TIPS[((n*5)%TIPS.length+TIPS.length)%TIPS.length]}
function tipHTML(){var t=todayTip(),g=GUIDES.filter(function(x){return x.id===t[0]})[0];
  return '<div class="card"><div class="tip" onclick="openGuide(\''+t[0]+'\',\''+t[1]+'\')"><span class="ic">📖</span><div class="tx"><div class="note" style="font-weight:800">今日のヒント（'+esc(g.title)+'）</div><div>'+esc(t[2])+'</div></div><span class="mo">読む ›</span></div></div>'}
function openGuide(g,c){if(state.dirty)saveDraft();state.learn={g:g,c:c};state.view='learn';segActive('viewSeg','view','learn');load()}
function renderLearn(){
  var L=state.learn, G=GUIDES.filter(function(x){return x.id===L.g})[0]||GUIDES[0];
  var h='<div class="card"><h2>📖 学ぶ</h2><div class="lead">毎日の仕事の「なぜ」と「どうやって」。少しずつ読んで、改善提案のヒントにしてください。</div><div class="gsw">'+
    GUIDES.map(function(x){return '<button type="button" class="'+(x.id===G.id?'active':'')+'" onclick="openGuide(\''+x.id+'\',null)"><b>'+x.icon+' '+esc(x.title)+'</b><span>'+esc(x.sub)+'</span></button>'}).join('')+'</div></div>';
  G.chapters.forEach(function(c,i){h+='<details class="ch" id="ch-'+c.id+'"'+(L.c===c.id?' open':'')+'><summary><span class="n">'+(i+1)+'</span>'+esc(c.t)+'</summary><div class="gc">'+c.html+'</div></details>'});
  h+='<div class="card"><button class="btn pri" type="button" style="width:100%" onclick="setView(\'write\')">日報を書く ›</button></div>';
  $('main').innerHTML=h;
  if(L.c){var el=$('ch-'+L.c);if(el)setTimeout(function(){el.scrollIntoView({block:'start'})},30)}else{var b=document.querySelector('.body');if(b)b.scrollTop=0}
}

// ===== 代表の設定（店長用パスワード） =====
function adminCfgHTML(){
  return '<div class="card admin"><h2>🔑 店長用パスワードの設定（代表のみ）</h2><div class="lead">'+SHOP[state.shop].name+'の店長が日報を開くためのパスワードです。店ごとに別のものを設定できます。</div>'+
    '<div class="two"><input id="cfgPw" type="password" data-cfg="1" autocomplete="new-password" placeholder="新しいパスワード（4文字以上）"><button class="btn" type="button" onclick="setPw()">'+SHOP[state.shop].name+'のパスワードを設定</button></div></div>';
}
async function setPw(){
  if(!state.admin){toast('代表のみ設定できます');return}
  var v=$('cfgPw').value.trim(); if(v.length<4){toast('4文字以上にしてください');return}
  await db.ref('nippo_cfg/pw/'+state.shop).set(await sha('nippo:'+state.shop+':'+v));
  $('cfgPw').value='';toast(SHOP[state.shop].name+'の店長用パスワードを設定しました');
}

window.addEventListener('beforeunload',function(e){if(state.dirty){e.preventDefault();e.returnValue=''}});
boot();
</script>
</body>
</html>
