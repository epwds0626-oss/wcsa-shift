<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<title>マニュアルノート</title>
<style>
:root{
  --bg:#eef1f3; --surface:#ffffff; --surface2:#f1f2f6; --surface3:#e7e9ef;
  --border:#d7dae2; --text:#1a1c22; --text2:#5b6070; --text3:#8c92a4;
  --accent:#b07d00; --accent-soft:rgba(176,125,0,0.12);
  --warn:#c0001a; --warn-soft:#fdecec; --limit:#1a5fa0; --limit-soft:#e9f1fb;
  --shadow:0 1px 3px rgba(20,25,40,0.06),0 4px 16px rgba(20,25,40,0.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100%}
.mhead{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:0 1px 6px rgba(20,25,40,0.05)}
.mhead-row{display:flex;align-items:center;gap:8px;padding:9px 12px}
.mtitle{font-size:15px;font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:6px;white-space:nowrap}
.mtitle .em{font-size:17px}
.spacer{flex:1}
.lockbtn{border:1px solid var(--border);background:var(--surface2);color:var(--text2);width:34px;height:32px;border-radius:9px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.lockbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.seg{display:flex;background:var(--surface3);border-radius:10px;padding:3px;gap:2px;flex-shrink:0}
.seg button{border:none;background:transparent;color:var(--text2);font-family:inherit;font-size:12px;font-weight:700;padding:6px 12px;border-radius:7px;cursor:pointer;white-space:nowrap;transition:.15s;letter-spacing:.02em}
.seg button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mhead-row2{display:flex;gap:8px;padding:0 12px 10px;align-items:center;overflow-x:auto;-webkit-overflow-scrolling:touch}
.mbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 12px 40px}
.mwrap{max-width:760px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 14px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s;position:relative;min-height:78px;display:flex;flex-direction:column;justify-content:center}
.pcard:active{transform:scale(.97)}
.pcard .pc-name{font-size:15px;font-weight:800;line-height:1.25}
.pcard .pc-meta{font-size:11px;color:var(--text3);margin-top:5px;font-weight:600}
.pcard .pc-arrow{position:absolute;right:11px;bottom:9px;color:var(--text3);font-size:13px}
.pcard.add{border-style:dashed;background:var(--surface2);align-items:center;color:var(--accent);font-weight:800}
.pcard .pcard-tools{position:absolute;top:7px;right:7px;display:flex;gap:4px}
.sec-label{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin:2px 2px 12px}
.detail-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.backbtn{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--text2);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px}
.backbtn:active{background:var(--surface2)}
.detail-title{font-size:20px;font-weight:900;letter-spacing:.01em}
.note-box{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:12px;padding:13px 15px;margin-bottom:18px;box-shadow:var(--shadow)}
.note-box .nb-label{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.08em;margin-bottom:5px}
.note-box .nb-text{font-size:13.5px;color:var(--text);white-space:pre-wrap;line-height:1.6}
.note-box .nb-text.empty{color:var(--text3)}
.block-title{font-size:12px;font-weight:800;color:var(--text2);letter-spacing:.1em;margin:22px 2px 12px;display:flex;align-items:center;gap:7px}
.block-title::before{content:'';width:4px;height:14px;background:var(--accent);border-radius:2px}
.tl{position:relative;padding-left:18px}
.tl::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl-item{position:relative;margin-bottom:12px}
.tl-item::before{content:'';position:absolute;left:-16px;top:16px;width:11px;height:11px;border-radius:50%;background:var(--dot,var(--accent));border:2.5px solid var(--surface);box-shadow:0 0 0 1px var(--border)}
.tl-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 13px;box-shadow:var(--shadow)}
.tl-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.time-chip{font-size:13px;font-weight:900;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.slot-chip{font-size:10.5px;font-weight:800;color:#fff;padding:2px 9px;border-radius:20px;letter-spacing:.04em}
.tl-task{font-size:14px;font-weight:600;color:var(--text);line-height:1.55;white-space:pre-wrap}
.tl-tags{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.tag{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;line-height:1.5;border-radius:8px;padding:7px 10px}
.tag.warn{background:var(--warn-soft);color:#8a0012}
.tag.limit{background:var(--limit-soft);color:#0f3f6e}
.tag .ti{font-size:12px;flex-shrink:0;margin-top:1px}
.tag .tl-label{font-weight:800;flex-shrink:0}
.tl-empty{text-align:center;color:var(--text3);padding:30px 20px;font-size:13px}
.man-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 15px;margin-bottom:10px;box-shadow:var(--shadow)}
.man-card .mc-h{font-size:14px;font-weight:800;color:var(--text);margin-bottom:7px;display:flex;align-items:center;gap:6px}
.man-card .mc-h::before{content:'▪';color:var(--accent);font-size:12px}
.man-card .mc-body{font-size:13px;color:var(--text);white-space:pre-wrap;line-height:1.65}
.editbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.ebtn{border:none;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:5px}
.ebtn.pri{background:var(--accent);color:#fff}
.ebtn.sec{background:var(--surface3);color:var(--text2)}
.ebtn:active{opacity:.8}
.row-tools{display:flex;gap:5px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--border);justify-content:flex-end}
.icon-btn{border:1px solid var(--border);background:var(--surface2);border-radius:7px;width:30px;height:28px;font-size:12px;cursor:pointer;color:var(--text2);display:inline-flex;align-items:center;justify-content:center}
.icon-btn.del{color:var(--warn);border-color:#f0c9c9}
.icon-btn:disabled{opacity:.3}
.overlay{position:fixed;inset:0;background:rgba(15,18,28,.55);z-index:100;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
@media(min-width:560px){.overlay{align-items:center;padding:20px}}
.sheet{background:var(--surface);width:100%;max-width:540px;border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:0 -8px 40px rgba(0,0,0,.25)}
@media(min-width:560px){.sheet{border-radius:18px}}
.sheet-head{position:sticky;top:0;background:var(--surface);padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;z-index:2}
.sheet-head h3{font-size:16px;font-weight:800}
.sheet-close{border:none;background:var(--surface3);width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--text2)}
.sheet-body{padding:16px 18px 22px}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:800;color:var(--text2);margin-bottom:6px;letter-spacing:.02em}
.field .hint{font-weight:500;color:var(--text3);font-size:11px;margin-left:5px}
.inp,.ta,.sel{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit;color:var(--text);background:var(--surface);transition:border-color .15s}
.inp:focus,.ta:focus,.sel:focus{outline:none;border-color:var(--accent)}
.ta{min-height:80px;resize:vertical;line-height:1.5}
.two{display:flex;gap:10px}.two>*{flex:1}
.save-row{display:flex;gap:10px;margin-top:6px}
.save-row .ebtn{flex:1;justify-content:center;padding:12px}
.pw-sheet{max-width:340px;border-radius:18px}
.pw-sheet .sheet-body{text-align:center}
.pw-err{color:var(--warn);font-size:12.5px;margin-top:8px;display:none;font-weight:700}
.saving-toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1a1c22;color:#fff;padding:9px 18px;border-radius:22px;font-size:13px;font-weight:700;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.saving-toast.show{opacity:1}
.conn-warn{background:#fff4e5;border:1px solid #f5d199;color:#8a5a00;font-size:12px;font-weight:600;padding:8px 12px;border-radius:10px;margin-bottom:12px;display:none}
</style>
</head>
<body>
<div id="app">
  <div class="mhead">
    <div class="mhead-row">
      <div class="mtitle"><span class="em">&#128203;</span>マニュアルノート</div>
      <div class="spacer"></div>
      <button class="lockbtn" id="lockBtn" onclick="toggleLock()" title="管理者編集">&#128274;</button>
    </div>
    <div class="mhead-row2">
      <div class="seg" id="shopSeg">
        <button data-shop="enya" class="active" onclick="setShop('enya')">本店</button>
        <button data-shop="marco" onclick="setShop('marco')">マルコ</button>
      </div>
      <div class="seg" id="secSeg">
        <button data-sec="kitchen" class="active" onclick="setSec('kitchen')">&#127859; キッチン</button>
        <button data-sec="hall" onclick="setSec('hall')">&#128717; ホール</button>
        <button data-sec="ops" onclick="setSec('ops')">&#9881; オペレ</button>
      </div>
    </div>
  </div>
  <div class="mbody">
    <div class="mwrap">
      <div class="conn-warn" id="connWarn">&#9888; オフライン表示中（初期テンプレート）。編集内容は保存されません。</div>
      <div id="view"></div>
    </div>
  </div>
</div>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="saving-toast" id="toast">保存しました</div>

var state={shop:"enya",sec:"kitchen",admin:false,sel:null,data:{enya:{kitchen:null,hall:null,ops:null},marco:{kitchen:null,hall:null,ops:null}}};
var listeners={};
function refPath(shop,sec){return 'manualv2/'+shop+'/'+sec;}
function attach(shop,sec){
  var key=shop+'/'+sec;
  if(!db){ state.data[shop][sec]=deepcopy(DEFAULTS[shop][sec]); showConn(true); if(current(shop,sec))render(); return; }
  if(listeners[key])return;
  listeners[key]=db.ref(refPath(shop,sec)).on('value',function(snap){
    var v=snap.val();
    if(v&&v.positions){ state.data[shop][sec]=normalize(v.positions); }
    else { state.data[shop][sec]=deepcopy(DEFAULTS[shop][sec]); }
    if(current(shop,sec))render();
  },function(){ state.data[shop][sec]=deepcopy(DEFAULTS[shop][sec]); showConn(true); if(current(shop,sec))render(); });
}
function current(shop,sec){return state.shop===shop&&state.sec===sec;}
function curList(){return state.data[state.shop][state.sec]||[];}
function normalize(arr){
  if(!Array.isArray(arr))return [];
  return arr.filter(Boolean).map(function(p){
    return {name:p.name||"",note:p.note||"",
      timeline:(Array.isArray(p.timeline)?p.timeline:[]).filter(Boolean).map(function(t){return {time:t.time||"",slot:t.slot||"",task:t.task||"",caution:t.caution||"",limit:t.limit||""};}),
      manual:(Array.isArray(p.manual)?p.manual:[]).filter(Boolean).map(function(m){return {h:m.h||"",body:m.body||""};})};
  });
}
function deepcopy(o){return JSON.parse(JSON.stringify(o));}
function showConn(on){var w=document.getElementById('connWarn');if(w)w.style.display=on?'block':'none';}
function save(){
  var list=curList();
  if(!db){ toast('オフラインのため保存できません'); return; }
  db.ref(refPath(state.shop,state.sec)).set({positions:list,updatedAt:Date.now()}).then(function(){toast('保存しました');}).catch(function(){toast('保存に失敗しました');});
}
function applyTheme(){document.documentElement.style.setProperty('--accent',SHOP_COLORS[state.shop]);document.documentElement.style.setProperty('--accent-soft',SHOP_SOFT[state.shop]);}
function render(){
  applyTheme();
  var v=document.getElementById('view');
  if(state.sel!==null && state.sel<curList().length){ v.innerHTML=renderDetail(curList()[state.sel]); }
  else { state.sel=null; v.innerHTML=renderList(); }
}
function renderList(){
  var list=curList();
  var shopName=state.shop==='enya'?'本店':'マルコ';
  var secName=state.sec==='kitchen'?'キッチン':(state.sec==='ops'?'オペレーション':'ホール');
  var h='<div class="sec-label">'+shopName+' / '+secName+'　ポジションを選択</div><div class="grid">';
  list.forEach(function(p,i){
    var n=(p.timeline?p.timeline.length:0);
    h+='<div class="pcard" onclick="openPos('+i+')">';
    if(state.admin){h+='<div class="pcard-tools" onclick="event.stopPropagation()"><button class="icon-btn" onclick="editPos('+i+')">&#9999;</button><button class="icon-btn del" onclick="delPos('+i+')">&#128465;</button></div>';}
    h+='<div class="pc-name">'+esc(p.name)+'</div><div class="pc-meta">'+n+' ステップ'+((p.manual&&p.manual.length)?' ・ 詳細あり':'')+'</div><div class="pc-arrow">&#8250;</div></div>';
  });
  if(state.admin){h+='<div class="pcard add" onclick="addPos()">＋ ポジション追加</div>';}
  h+='</div>';
  if(list.length===0&&!state.admin){h+='<div class="tl-empty">まだ登録されていません。右上の&#128274;から管理者ログイン（0626）で追加できます。</div>';}
  return h;
}
function renderDetail(p){
  var h='<div class="detail-head"><button class="backbtn" onclick="backToList()">&#8249; 一覧</button><div class="detail-title">'+esc(p.name)+'</div></div>';
  if(state.admin){h+='<div class="editbar"><button class="ebtn pri" onclick="addRow()">＋ ステップ</button><button class="ebtn sec" onclick="editNote()">&#128221; 要点</button><button class="ebtn sec" onclick="addMan()">＋ 詳細マニュアル</button></div>';}
  if(p.note||state.admin){h+='<div class="note-box"><div class="nb-label">&#128204; このポジションの要点</div><div class="nb-text'+(p.note?'':' empty')+'">'+(p.note?esc(p.note):'（未記入）')+'</div></div>';}
  var tl=p.timeline||[];
  h+='<div class="block-title">タイムライン</div>';
  if(tl.length===0){h+='<div class="tl-empty">ステップがまだありません。'+(state.admin?'「＋ ステップ」から追加。':'')+'</div>';}
  else{
    h+='<div class="tl">';
    tl.forEach(function(t,i){
      var col=slotColor(t.slot);
      h+='<div class="tl-item" style="--dot:'+col+'"><div class="tl-card"><div class="tl-top">';
      if(t.time)h+='<span class="time-chip">'+esc(t.time)+'</span>';
      if(t.slot)h+='<span class="slot-chip" style="background:'+col+'">'+esc(t.slot)+'</span>';
      h+='</div>';
      if(t.task)h+='<div class="tl-task">'+esc(t.task)+'</div>';
      var tags='';
      if(t.caution)tags+='<div class="tag warn"><span class="ti">&#9888;</span><span><span class="tl-label">注意 </span>'+esc(t.caution)+'</span></div>';
      if(t.limit)tags+='<div class="tag limit"><span class="ti">&#9201;</span><span><span class="tl-label">制限時間 </span>'+esc(t.limit)+'</span></div>';
      if(tags)h+='<div class="tl-tags">'+tags+'</div>';
      if(state.admin){h+='<div class="row-tools"><button class="icon-btn" onclick="moveRow('+i+',-1)" '+(i===0?'disabled':'')+'>&#9650;</button><button class="icon-btn" onclick="moveRow('+i+',1)" '+(i===tl.length-1?'disabled':'')+'>&#9660;</button><button class="icon-btn" onclick="editRow('+i+')">&#9999;</button><button class="icon-btn del" onclick="delRow('+i+')">&#128465;</button></div>';}
      h+='</div></div>';
    });
    h+='</div>';
  }
  var man=p.manual||[];
  if(man.length||state.admin){
    h+='<div class="block-title">詳細マニュアル</div>';
    man.forEach(function(m,i){
      h+='<div class="man-card"><div class="mc-h">'+esc(m.h)+'</div><div class="mc-body">'+esc(m.body)+'</div>';
      if(state.admin){h+='<div class="row-tools"><button class="icon-btn" onclick="moveMan('+i+',-1)" '+(i===0?'disabled':'')+'>&#9650;</button><button class="icon-btn" onclick="moveMan('+i+',1)" '+(i===man.length-1?'disabled':'')+'>&#9660;</button><button class="icon-btn" onclick="editMan('+i+')">&#9999;</button><button class="icon-btn del" onclick="delMan('+i+')">&#128465;</button></div>';}
      h+='</div>';
    });
    if(man.length===0)h+='<div class="tl-empty">詳細マニュアルは未登録。「＋ 詳細マニュアル」から追加。</div>';
  }
  return h;
}
function setShop(s){state.shop=s;state.sel=null;segActive('shopSeg','shop',s);applyTheme();attach(s,state.sec);render();}
function setSec(s){state.sec=s;state.sel=null;segActive('secSeg','sec',s);attach(state.shop,s);render();}
function segActive(segId,attr,val){var seg=document.getElementById(segId);Array.prototype.forEach.call(seg.querySelectorAll('button'),function(b){b.classList.toggle('active',b.getAttribute('data-'+attr)===val);});}
function openPos(i){state.sel=i;document.querySelector('.mbody').scrollTop=0;render();}
function backToList(){state.sel=null;render();}
function toggleLock(){if(state.admin){state.admin=false;document.getElementById('lockBtn').className='lockbtn';document.getElementById('lockBtn').textContent='🔒';render();return;}openPwSheet();}
function openPwSheet(){
  var s=document.getElementById('sheet');s.className='sheet pw-sheet';
  s.innerHTML='<div class="sheet-head"><h3>&#128274; 管理者ログイン</h3><button class="sheet-close" onclick="closeSheet()">&times;</button></div><div class="sheet-body"><div class="field" style="margin-bottom:8px"><input class="inp" id="pwInp" type="tel" inputmode="numeric" placeholder="パスワード" style="text-align:center;letter-spacing:4px;font-size:20px" autocomplete="off"></div><div class="pw-err" id="pwErr">パスワードが違います</div><div class="save-row"><button class="ebtn pri" onclick="checkPw()">ログイン</button></div></div>';
  openSheet();setTimeout(function(){var el=document.getElementById('pwInp');if(el){el.focus();el.onkeydown=function(e){if(e.key==='Enter')checkPw();};}},100);
}
function checkPw(){var raw=(document.getElementById('pwInp').value||'').replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);}).trim();if(raw===ADMIN_PASS){state.admin=true;document.getElementById('lockBtn').className='lockbtn on';document.getElementById('lockBtn').textContent='🔓';closeSheet();render();}else{document.getElementById('pwErr').style.display='block';}}
function addPos(){var name=prompt('新しいポジション名');if(!name)return;name=cleanKey(name);curList().push({name:name,note:"",timeline:[],manual:[]});save();render();}
function editPos(i){var p=curList()[i];var name=prompt('ポジション名を編集',p.name);if(name===null)return;name=cleanKey(name);if(!name)return;p.name=name;save();render();}
function delPos(i){var p=curList()[i];if(!confirm('「'+p.name+'」を削除しますか？'))return;curList().splice(i,1);save();render();}
function editNote(){
  var p=curList()[state.sel];var s=document.getElementById('sheet');s.className='sheet';
  s.innerHTML='<div class="sheet-head"><h3>&#128221; '+esc(p.name)+' の要点</h3><button class="sheet-close" onclick="closeSheet()">&times;</button></div><div class="sheet-body"><div class="field"><label>このポジションで一番大事なこと</label><textarea class="ta" id="fNote" style="min-height:110px">'+esc(p.note)+'</textarea></div><div class="save-row"><button class="ebtn sec" onclick="closeSheet()">キャンセル</button><button class="ebtn pri" onclick="saveNote()">保存</button></div></div>';
  openSheet();
}
function saveNote(){curList()[state.sel].note=document.getElementById('fNote').value.trim();closeSheet();save();render();}
var SLOT_PRESETS=["仕込み","準備","開店準備","ランチ営業","営業中","ディナー準備","ディナー営業","提供","清掃","閉店作業","クローズ"];
function rowSheet(title,onsave,cur){
  cur=cur||{time:"",slot:"",task:"",caution:"",limit:""};
  var opts='<option value=""></option>';SLOT_PRESETS.forEach(function(sl){opts+='<option value="'+sl+'"'+(sl===cur.slot?' selected':'')+'>'+sl+'</option>';});
  var s=document.getElementById('sheet');s.className='sheet';
  s.innerHTML='<div class="sheet-head"><h3>'+title+'</h3><button class="sheet-close" onclick="closeSheet()">&times;</button></div><div class="sheet-body">'
   +'<div class="two"><div class="field"><label>時刻/時間帯<span class="hint">例 11:30 / 営業前</span></label><input class="inp" id="fTime" value="'+esc(cur.time)+'"></div>'
   +'<div class="field"><label>区分</label><input class="inp" id="fSlot" list="slotList" value="'+esc(cur.slot)+'"><datalist id="slotList">'+opts+'</datalist></div></div>'
   +'<div class="field"><label>やること</label><textarea class="ta" id="fTask">'+esc(cur.task)+'</textarea></div>'
   +'<div class="field"><label>&#9888; 注意点<span class="hint">任意</span></label><textarea class="ta" id="fCaution" style="min-height:56px">'+esc(cur.caution)+'</textarea></div>'
   +'<div class="field"><label>&#9201; 制限時間<span class="hint">任意</span></label><input class="inp" id="fLimit" value="'+esc(cur.limit)+'"></div>'
   +'<div class="save-row"><button class="ebtn sec" onclick="closeSheet()">キャンセル</button><button class="ebtn pri" id="rowSaveBtn">保存</button></div></div>';
  openSheet();
  document.getElementById('rowSaveBtn').onclick=function(){var row={time:v('fTime'),slot:v('fSlot'),task:v('fTask'),caution:v('fCaution'),limit:v('fLimit')};if(!row.time&&!row.task){toast('時刻かやることを入力');return;}onsave(row);closeSheet();save();render();};
  function v(id){return (document.getElementById(id).value||'').trim();}
}
function addRow(){rowSheet('＋ ステップ追加',function(r){curList()[state.sel].timeline.push(r);});}
function editRow(i){var t=curList()[state.sel].timeline[i];rowSheet('&#9999; ステップ編集',function(r){curList()[state.sel].timeline[i]=r;},t);}
function delRow(i){var tl=curList()[state.sel].timeline;if(!confirm('このステップを削除しますか？'))return;tl.splice(i,1);save();render();}
function moveRow(i,d){var tl=curList()[state.sel].timeline;var j=i+d;if(j<0||j>=tl.length)return;var t=tl[i];tl[i]=tl[j];tl[j]=t;save();render();}
function manSheet(title,onsave,cur){
  cur=cur||{h:"",body:""};
  var s=document.getElementById('sheet');s.className='sheet';
  s.innerHTML='<div class="sheet-head"><h3>'+title+'</h3><button class="sheet-close" onclick="closeSheet()">&times;</button></div><div class="sheet-body">'
   +'<div class="field"><label>見出し</label><input class="inp" id="mH" value="'+esc(cur.h)+'" placeholder="例：禁止事項 / 清掃スケジュール"></div>'
   +'<div class="field"><label>本文</label><textarea class="ta" id="mB" style="min-height:140px">'+esc(cur.body)+'</textarea></div>'
   +'<div class="save-row"><button class="ebtn sec" onclick="closeSheet()">キャンセル</button><button class="ebtn pri" id="manSaveBtn">保存</button></div></div>';
  openSheet();
  document.getElementById('manSaveBtn').onclick=function(){var m={h:(document.getElementById('mH').value||'').trim(),body:(document.getElementById('mB').value||'').trim()};if(!m.h&&!m.body){toast('見出しか本文を入力');return;}onsave(m);closeSheet();save();render();};
}
function addMan(){manSheet('＋ 詳細マニュアル追加',function(m){if(!curList()[state.sel].manual)curList()[state.sel].manual=[];curList()[state.sel].manual.push(m);});}
function editMan(i){var m=curList()[state.sel].manual[i];manSheet('&#9999; 詳細マニュアル編集',function(x){curList()[state.sel].manual[i]=x;},m);}
function delMan(i){var man=curList()[state.sel].manual;if(!confirm('この項目を削除しますか？'))return;man.splice(i,1);save();render();}
function moveMan(i,d){var man=curList()[state.sel].manual;var j=i+d;if(j<0||j>=man.length)return;var t=man[i];man[i]=man[j];man[j]=t;save();render();}
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function cleanKey(s){return String(s).replace(/[.#$\[\]\/]/g,'').trim();}
function openSheet(){document.getElementById('overlay').classList.add('show');}
function closeSheet(){document.getElementById('overlay').classList.remove('show');}
var toastTimer;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},1600);}
applyTheme();attach('enya','kitchen');render();
</script>
</body>
</html>
