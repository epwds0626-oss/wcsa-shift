<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<title>魚の雑学帳</title>
<style>
:root{
  --ice:#E6EBED;
  --ice-2:#F2F5F6;
  --ink:#0E212B;
  --ai:#1F4E5F;
  --ai-2:#2E6E82;
  --gin:#6F7E85;
  --gin-2:#9AA8AD;
  --chiai:#A8342B;
  --kombu:#6B7A3C;
  --line:rgba(14,33,43,.14);
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  --sans:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--ice);color-scheme:light only;-webkit-text-size-adjust:100%}
body{
  background:var(--ice);
  min-height:100vh;
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}

/* ---------- header ---------- */
header{
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#F4F7F8,var(--ice));
  position:relative;z-index:40;
}
.head-in{max-width:1080px;margin:0 auto;padding:14px 20px 0}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{
  font-family:var(--serif);
  font-size:26px;font-weight:600;margin:0;
  letter-spacing:.16em;
}
.brand .sub{
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;
  color:var(--gin);text-transform:uppercase;
}
.brand .count{
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;
  color:var(--ai);margin-left:auto;
}

/* controls row */
.controls{display:flex;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap}
.search{
  flex:1 1 220px;min-width:180px;
  padding:9px 14px;border:1px solid var(--line);
  background:#fff;border-radius:2px;font-family:var(--sans);font-size:14px;color:var(--ink);
}
.search::placeholder{color:var(--gin-2)}
.search:focus{outline:2px solid var(--ai-2);outline-offset:1px}
.shuffle{
  appearance:none;border:1px solid var(--line);background:#fff;cursor:pointer;
  font-family:var(--sans);font-size:13px;color:var(--ai);
  padding:9px 16px;border-radius:2px;letter-spacing:.04em;white-space:nowrap;
}
.shuffle:hover{background:var(--ice-2);border-color:var(--ai-2)}

/* filter chips */
.filters{display:flex;flex-wrap:wrap;gap:5px;padding:12px 0 14px}
.f-btn{
  appearance:none;cursor:pointer;font-family:var(--sans);font-size:12.5px;
  padding:5px 13px;border:1px solid var(--line);background:transparent;color:var(--gin);
  border-radius:99px;letter-spacing:.02em;display:flex;align-items:center;gap:5px;
}
.f-btn .n{font-family:var(--mono);font-size:10px;color:var(--gin-2)}
.f-btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ice-2)}
.f-btn[aria-pressed="true"] .n{color:var(--gin-2)}
.f-btn:focus-visible{outline:2px solid var(--ai-2);outline-offset:2px}

/* ---------- main ---------- */
main{max-width:1080px;margin:0 auto;padding:18px 20px 90px}

/* random spotlight card */
.spotlight{
  background:#fff;border:1px solid var(--line);border-left:3px solid var(--chiai);
  padding:20px 22px;margin-bottom:26px;position:relative;
}
.spotlight .eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--gin);margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;
}
.spotlight .genre{font-size:11px;color:var(--kombu)}
.spotlight .st-title{font-family:var(--serif);font-size:19px;font-weight:600;margin:0 0 8px;letter-spacing:.03em;line-height:1.4}
.spotlight .st-body{font-size:14.5px;margin:0}
.spotlight .st-again{
  margin-top:14px;appearance:none;border:1px solid var(--line);background:transparent;cursor:pointer;
  font-family:var(--mono);font-size:11px;color:var(--ai);padding:5px 12px;border-radius:2px;letter-spacing:.08em;
}
.spotlight .st-again:hover{background:var(--ice-2)}

/* group heading */
.grp-head{
  font-family:var(--serif);font-size:18px;letter-spacing:.08em;font-weight:600;
  margin:26px 0 4px;padding-bottom:8px;border-bottom:2px solid var(--ink);
  display:flex;align-items:baseline;gap:10px;
}
.grp-head .gn{font-family:var(--mono);font-size:11px;color:var(--gin);letter-spacing:.14em;font-weight:400}
.grp-head:first-of-type{margin-top:6px}

/* trivia list */
.tlist{display:grid;grid-template-columns:1fr 1fr;gap:0 34px}
@media(max-width:820px){.tlist{grid-template-columns:1fr}}
.tcard{
  break-inside:avoid;border-top:1px solid var(--line);padding:15px 0 17px;
}
.tcard .th{display:flex;gap:10px;align-items:baseline;margin-bottom:5px}
.tcard .tnum{font-family:var(--mono);font-size:10px;color:var(--gin-2);flex:0 0 auto;padding-top:2px}
.tcard .tt{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.03em;line-height:1.45;margin:0}
.tcard .tb{font-size:14px;margin:0;color:#12333f}
.tcard mark{background:rgba(168,52,43,.16);color:var(--chiai);padding:0 2px;border-radius:2px}

/* empty state */
.empty{
  text-align:center;color:var(--gin);font-size:14px;padding:60px 20px;
}
.empty .big{font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:8px}

footer{max-width:1080px;margin:0 auto;padding:0 20px 60px;color:var(--gin);font-size:12px;line-height:1.9}
footer hr{border:0;border-top:1px solid var(--line);margin:0 0 16px}

@media(max-width:600px){
  .brand h1{font-size:22px}
  .brand .count{width:100%;margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* WCSAに戻るボタン */
.back-wcsa{
  position:fixed;top:12px;right:14px;z-index:60;
  appearance:none;cursor:pointer;
  font-family:var(--sans);font-size:12.5px;color:var(--ai);
  background:rgba(255,255,255,.92);border:1px solid var(--line);
  padding:7px 14px;border-radius:99px;letter-spacing:.04em;
  backdrop-filter:blur(6px);box-shadow:0 1px 6px rgba(14,33,43,.10);
  display:flex;align-items:center;gap:5px;
}
.back-wcsa:hover{background:#fff;border-color:var(--ai-2)}
.back-wcsa:active{transform:scale(.96)}
@media(max-width:600px){.back-wcsa{top:10px;right:10px;font-size:12px;padding:6px 12px}}
</style>
</head>
<body>

<button class="back-wcsa" id="backWcsa" type="button">‹ WCSAに戻る</button>

<header>
  <div class="head-in">
    <div class="brand">
      <h1>魚の雑学帳</h1>
      <span class="sub">fish &amp; cooking trivia</span>
      <span class="count" id="count"></span>
    </div>
    <div class="controls">
      <input class="search" id="q" type="search" placeholder="キーワードで探す（例：うま味、生臭さ、アニサキス）" aria-label="雑学を検索">
      <button class="shuffle" id="shuffle" type="button">🎲 ランダム</button>
    </div>
    <div class="filters" id="filters"></div>
  </div>
</header>

<main>
  <section class="spotlight" id="spotlight" hidden>
    <div class="eyebrow"><span>今日の一問</span><span class="genre" id="sp-genre"></span></div>
    <h3 class="st-title" id="sp-title"></h3>
    <p class="st-body" id="sp-body"></p>
    <button class="st-again" id="sp-again" type="button">別の雑学を見る</button>
  </section>

  <div id="list"></div>
</main>

<footer>
  <hr>
  出典は水産学・食品科学・調理科学の一般的知見および査読研究に基づく。<br>
  生食は鮮度と衛生管理が前提。サバ・イワシ・サンマ・カツオなどはアニサキス対策（目視・冷凍）を。
</footer>

<script>
/* ============================================================
   データ  { g:ジャンルキー, t:見出し, b:本文 }
============================================================ */
const GENRES = {
  body:   {label:'からだの構造・生理'},
  sense:  {label:'感覚・知能・行動'},
  breed:  {label:'繁殖・性別'},
  evo:    {label:'進化・分類'},
  scale:  {label:'生態・スケール感'},
  misc:   {label:'雑多・意外'},
  umami:  {label:'うま味・熟成'},
  prep:   {label:'下処理・鮮度'},
  heat:   {label:'加熱・焼く・揚げる'},
  sushi:  {label:'生食・寿司'},
  part:   {label:'部位・食べ方'},
  dashi:  {label:'出汁・保存・調味'},
  tech:   {label:'技法・道具'},
  world:  {label:'世界の魚料理・発酵'},
  match:  {label:'相性・組み合わせ'},
  fail:   {label:'失敗の原因と対策'},
  health: {label:'栄養・健康・安全'},
  culture:{label:'食文化・雑学'}
};

const T = [
/* ===== 生物：からだの構造・生理 ===== */
{g:'body',t:'魚は一生成長し続ける',b:'哺乳類と違い成長板が閉じないため、寿命が長い個体ほど巨大になる。栄養と水温が十分なら大きくなり続ける。大物は長寿の証拠。'},
{g:'body',t:'年齢は「耳石」の年輪でわかる',b:'内耳の炭酸カルシウムの塊（耳石）に木の年輪のような線が刻まれる。薄く切って顕微鏡で年齢査定する。1日1本の日輪まで読める種もいる。'},
{g:'body',t:'ウロコにも年輪がある',b:'成長の速い夏は間隔が広く、遅い冬は狭い。この密度差で年齢を推定できる。'},
{g:'body',t:'マグロは体温が水温より高い',b:'マグロ・カツオ・ホホジロザメは「奇網」という血管の熱交換システムを持ち、筋肉熱を逃さず体温を保つ（局所内温性）。だから高速で泳ぎ続けられる。'},
{g:'body',t:'全身温血の魚が1種いる',b:'アカマンボウ（Opah）は2015年、全身を水温より約5℃高く保つ世界初の全身温血魚と確認された。エラで熱を回収する構造を持つ。'},
{g:'body',t:'エラ呼吸は「向流交換」で効率化',b:'口から吸った水をエラに通す際、毛細血管が水と逆向きに流れることで溶存酸素を効率よく取り込む。'},
{g:'body',t:'止まると死ぬ魚がいる',b:'マグロ・カツオ・多くのサメはエラを自力で動かせず、泳いで口に水を流し込まないと窒息する（ラム換水）。眠っていても泳ぎ続ける。'},
{g:'body',t:'浮き袋で浮力を無コスト調整',b:'多くの硬骨魚は体内のガス袋の量を変え、エネルギーを使わず任意の深さに留まれる。サメには浮き袋がなく、油の多い巨大な肝臓で浮く。'},
{g:'body',t:'深海魚は浮き袋が退化しがち',b:'高水圧では浮き袋の維持コストが高い。急に釣り上げると膨張して口から飛び出すことがある（減圧障害）。'},
{g:'body',t:'魚の心臓は一心房一心室',b:'血液は「心臓→エラ→全身→心臓」と一方向に一周する単一循環。哺乳類の二重循環より原始的。'},
{g:'body',t:'側線という“第六感”がある',b:'体側に並ぶ感覚器で水の振動・水流・圧力を感知。暗闇や濁り水でも障害物や仲間、獲物を察知できる。群れが一斉に向きを変えられる理由。'},
{g:'body',t:'サメは微弱な電気を感じる',b:'頭部のゼリー状の穴（ロレンチーニ器官）で獲物の筋肉が発する微弱な生体電流を検知。砂に隠れた獲物も見つける。'},
{g:'body',t:'魚の目は近視ぎみ',b:'水中は光の屈折が少ないため、球形の水晶体を前後に動かしてピントを合わせる（人間はレンズの厚みを変える）。'},

/* ===== 生物：感覚・知能・行動 ===== */
{g:'sense',t:'魚は痛みを感じている可能性が高い',b:'口周りに痛覚神経を持ち、有害刺激で警戒・回避行動をとることが実験で示されている。魚の福祉が近年の研究テーマ。'},
{g:'sense',t:'金魚の記憶は「3秒」ではない',b:'俗説に反し、金魚はレバー操作やルートを数か月覚える。餌の時間や飼い主も学習する。'},
{g:'sense',t:'鏡で自分を認識する魚がいる',b:'ホンソメワケベラは鏡に映った自分の印を、鏡を見ながらこすり落とそうとする（2019年）。自己認識は霊長類やイルカに限るという常識を覆した。'},
{g:'sense',t:'道具を使う魚がいる',b:'ベラの仲間は硬い貝を岩に叩きつけて割る。魚は知能が低いという先入観を覆す行動。'},
{g:'sense',t:'多くの魚は色が見える',b:'網膜に複数種の錐体細胞を持ち、紫外線まで見える種もいる。繁殖期の派手な婚姻色は色覚を前提とした信号。'},
{g:'sense',t:'魚は音を出し、聞いている',b:'浮き袋を筋肉で震わせたり歯や骨をこすって発音する。ホウボウ、ニベ、イシモチは「鳴く魚」。繁殖や威嚇のコミュニケーション。'},
{g:'sense',t:'深海魚は自ら光を作る',b:'生物発光で獲物をおびき寄せ（チョウチンアンコウ）、仲間と合図し、腹を光らせて影を消す。共生バクテリアの発光が多い。'},
{g:'sense',t:'魚は眠るがまぶたがない',b:'多くの魚はまぶたを持たず、目を開けたまま活動を止めて休む。サンゴ礁の魚は夜に岩陰でじっとする。'},
{g:'sense',t:'群れは1匹のように動く',b:'側線で隣を感知し「近づきすぎない・離れすぎない・向きを揃える」という単純ルールで全体が統率されて見える。捕食者を混乱させる防御。'},

/* ===== 生物：繁殖・性別 ===== */
{g:'breed',t:'性転換する魚がいる',b:'クマノミはメスが死ぬと最優位のオスがメスに変わる（雄性先熟）。ハタやベラの多くは逆にメス→オス。群れの性比を最適化する戦略。'},
{g:'breed',t:'ニモの父は本当はメスになる',b:'クマノミの生態に従えば、母を失った後は父マーリンがメス化するのが生物学的に正しい。'},
{g:'breed',t:'マンボウは一度に最大3億個産む',b:'脊椎動物で最多クラス。ほとんどが捕食されるための“数打ち戦略”。'},
{g:'breed',t:'オスが妊娠・出産する魚がいる',b:'タツノオトシゴ（ヨウジウオ科）はオスの育児嚢にメスが産卵し、オスが妊娠・出産する。'},
{g:'breed',t:'チョウチンアンコウはオスが融合する',b:'極小のオスがメスに噛みつき皮膚・血管が癒合して一体化。オスは精子製造器官に成り下がる。暗黒でパートナーを探し続ける非効率を避ける適応。'},
{g:'breed',t:'サケは生まれた川に戻る',b:'嗅覚で稚魚期の川の匂いを記憶し、地磁気もナビに使う（母川回帰）。産卵後に力尽きて死に、死骸が森と川に栄養を還す。'},

/* ===== 生物：進化・分類 ===== */
{g:'evo',t:'「魚類」は単一のグループではない',b:'分類上、両生類・爬虫類・鳥類・哺乳類（＝我々）はある種の魚の子孫。厳密にはヒトも魚の末裔で、“魚”は便宜的な呼び名にすぎない。'},
{g:'evo',t:'シーラカンスは“生きた化石”',b:'約4億年前から姿がほぼ変わらず、絶滅したと思われていたが1938年に生きた個体が発見された。肉質のヒレは四肢動物の脚の原型に近い。'},
{g:'evo',t:'肺で呼吸する魚がいる',b:'ハイギョ（肺魚）は原始的な肺を持ち、乾季は泥に潜って空気呼吸で数か月〜数年生き延びる（夏眠）。'},
{g:'evo',t:'陸を歩く魚がいる',b:'トビハゼ・ムツゴロウは干潟で胸ビレを使い這い、皮膚呼吸する。ウォーキングキャットフィッシュは陸を移動して別の水場へ。'},
{g:'evo',t:'電気を作る魚がいる',b:'デンキウナギは最大約860Vで獲物を気絶させる（実は南米ナイフフィッシュの仲間で“ウナギ”ではない）。デンキナマズ、シビレエイも発電。'},
{g:'evo',t:'透明な魚がいる',b:'ウナギの葉形仔魚など稚魚や一部深海魚は体が透明で、捕食者から見つかりにくい。'},
{g:'evo',t:'魚のヒレは指の原型',b:'肉鰭類（シーラカンス・肺魚）のヒレの骨格が、両生類以降の四肢＝我々の腕・脚・指へ進化した。'},

/* ===== 生物：生態・スケール ===== */
{g:'scale',t:'世界最大の魚はジンベエザメ',b:'体長10m超。だがプランクトンを漉し取って食べるおとなしい濾過摂食者。'},
{g:'scale',t:'世界最小級の魚は約8mm',b:'インドネシアの淡水魚パエドキプリスは成魚でも1cm未満。脊椎動物として最小クラス。'},
{g:'scale',t:'水深8000m超にも魚がいる',b:'マリアナ海溝などでクサウオ科（スネイルフィッシュ）が確認。高水圧に適応した特殊なタンパク質構造を持つ。'},
{g:'scale',t:'最速の魚はバショウカジキ',b:'瞬間時速100km前後とされる。細長い体と大きな背ビレをたたんで水の抵抗を減らす。'},
{g:'scale',t:'海水魚と淡水魚は浸透圧が真逆',b:'海水魚は水を奪われるので海水を飲み塩をエラから排出。淡水魚は水が入り込むので薄い尿を大量に出す。サケは一生でこの機能を切り替える。'},
{g:'scale',t:'真っ黒すぎる深海魚がいる',b:'体表で光を99.9%以上吸収する超黒色の魚（クロカムリクラゲウオ等）。深海の発光から身を隠す究極の迷彩。'},

/* ===== 生物：雑多・意外 ===== */
{g:'misc',t:'タコ・イカ・貝は「魚」ではない',b:'それぞれ軟体動物。エビ・カニは甲殻類。「魚介類」とまとめて呼ぶだけで、生物学的には別グループ。'},
{g:'misc',t:'クジラ・イルカは哺乳類',b:'肺呼吸し胎生で子を産み母乳で育てる。尾ビレが水平（魚は垂直）なのが泳ぐ姿の見分け方。'},
{g:'misc',t:'白身と赤身は「筋肉の使い方」の違い',b:'マグロ・カツオなど回遊魚は持久筋（遅筋）が発達し酸素運搬色素ミオグロビンが多く赤い。ヒラメ・タイは瞬発の速筋主体で白い。生活史が肉の色に出る。'},
{g:'misc',t:'フグの毒はフグ自身が作らない',b:'テトロドトキシンは餌の細菌由来で、食物連鎖で肝臓・卵巣に蓄積する。無毒の餌で養殖すると毒を持たない。神経のナトリウムチャネルを塞ぐ猛毒。'},

/* ===== 料理：うま味・熟成 ===== */
{g:'umami',t:'魚のうま味の正体はイノシン酸',b:'死後、筋肉のATPが分解されてイノシン酸が生成・蓄積する。獲れたてより少し置いた方が美味い理由。ただし腐敗も進むので“ピーク”を狙うのが熟成の技術。'},
{g:'umami',t:'昆布×魚で「うま味の相乗効果」',b:'グルタミン酸（昆布）とイノシン酸（魚）を合わせると、単独の和より数倍強く感じる。昆布出汁で炊く・昆布締めは科学的に正解。'},
{g:'umami',t:'熟成は酵素による自己消化',b:'魚自身のプロテアーゼがタンパク質をアミノ酸へ分解し、うま味と柔らかさが増す。温度管理を誤ると腐敗に転ぶ諸刃の剣。'},
{g:'umami',t:'昆布締めは浸透圧で身を締める',b:'昆布の塩分と吸湿性で余分な水分が抜け、身が締まり、同時に昆布のグルタミン酸が移る。脱水とうま味付与の二重効果。'},
{g:'umami',t:'昆布＋魚＋きのこで三重奏',b:'グルタミン酸（昆布）＋イノシン酸（魚）＋グアニル酸（干し椎茸）で相乗効果が最大化。椀物の設計思想。'},

/* ===== 料理：下処理・鮮度 ===== */
{g:'prep',t:'活け締め・血抜きで生臭さが減る',b:'血液は生臭さと腐敗の温床。締めてすぐ血を抜くと、ヘモグロビン由来の臭みと細菌の栄養源が減る。'},
{g:'prep',t:'神経締めで鮮度が長持ちする',b:'ワイヤーで脊髄を破壊すると死後も続く神経の“暴れ”信号が止まり、ATP消費と乳酸生成が遅れる。死後硬直が遅れ身の劣化が緩やかに。'},
{g:'prep',t:'生臭さの主因はトリメチルアミン',b:'海水魚は浸透圧調整のためTMAO（無臭）を蓄える。死後に細菌・酵素でTMAに還元されて生臭くなる。鮮度が落ちるほど強い。'},
{g:'prep',t:'レモンで生臭さが減るのは中和',b:'臭いの元TMAはアルカリ性。レモンの酸（クエン酸）が中和し、揮発しにくい塩に変えるため臭いが抑えられる。'},
{g:'prep',t:'牛乳に浸けると臭みが取れる',b:'牛乳のタンパク質（カゼイン）やコロイド粒子が臭い成分を吸着する。下処理で魚を牛乳に浸ける手法の根拠。'},
{g:'prep',t:'塩を振って置くのは臭み抜き＋身締め',b:'浸透圧で臭みを含む余分な水分（ドリップ）が抜け、タンパク質が変性して身が締まる。焼く前の“塩を打って水を拭く”工程の意味。'},
{g:'prep',t:'サバは「生き腐れ」と言われる',b:'酵素活性が高くヒスチジンがヒスタミンに変わりやすい。じんましん様のヒスタミン食中毒の原因。低温管理が必須な理由。'},
{g:'prep',t:'アニサキスは加熱か冷凍でしか死なない',b:'60℃1分以上、または−20℃で24時間以上で死滅。酢・塩・わさびでは死なない（俗説に注意）。'},
{g:'prep',t:'あらの霜降りは臭み抜き',b:'頭・骨に熱湯をかけ血合い・ぬめり・鱗を落とすと、出汁が澄んで臭みが出ない。潮汁・アラ煮の下ごしらえの要。'},
{g:'prep',t:'切れない包丁は魚をまずくする',b:'刃が鈍いと繊維を押しつぶし、細胞が壊れてうま味と水分が流出する。よく研いだ包丁の断面はツヤがあり味も良い。研ぎは味の問題。'},

/* ===== 料理：加熱 ===== */
{g:'heat',t:'皮目がパリッとするのはメイラード反応',b:'高温でアミノ酸と糖が反応し香ばしい風味と焼き色が生まれる。皮から焼く「皮目焼き」は香りと食感の演出。'},
{g:'heat',t:'身が白くなるのはタンパク質の熱変性',b:'加熱でタンパク質の構造がほどけて固まり、透明→白へ。火の通りの目安。中心が半透明なら生焼け。'},
{g:'heat',t:'加熱しすぎるとパサつく',b:'タンパク質が過度に収縮して保水力を失い水分と脂が抜ける。低温調理（コンフィ・湯煎）でしっとりするのはこの収縮を抑えるため。'},
{g:'heat',t:'低温調理は50〜60℃が壁',b:'魚のタンパク質は主に50℃前後から変性し始め、高温ほど収縮して水を絞り出す。低温を保つと固まりつつ保水でき、火は通るのにジューシー。'},
{g:'heat',t:'揚げ物の衣は水分の置換でサクサク',b:'高温油で衣の水分が一気に蒸発し、その隙間に油が入って多孔質になる。二度揚げは一度目で中まで火を通し、二度目で一気に脱水してサクサクに。'},
{g:'heat',t:'フライパンに魚がくっつくのは化学結合',b:'冷たい金属面に生の身のタンパク質が結合してしまう。十分に予熱し焼き色がつくまで動かさないと、表面が変性して自然に剥がれる。'},
{g:'heat',t:'照り焼きの“照り”はカラメル化＋メイラード',b:'みりん・砂糖・醤油の糖とアミノ酸が加熱で反応し、粘りとツヤ、香ばしさを生む。'},
{g:'heat',t:'焼き魚は「強火の遠火」が理想',b:'強い熱で表面を素早く固めうま味を閉じ込めつつ、遠ざけて中まで焦がさず火を通す。放射熱でじっくり——七輪や炭火が美味い根拠。'},
{g:'heat',t:'炭火が美味いのは遠赤外線と燻香',b:'炭は遠赤外線を多く放射し、表面を焦がさず内部まで熱が伝わる。滴った脂が炭に落ちて生じる燻煙が香りをつける。'},
{g:'heat',t:'煮こごりはコラーゲンのゼラチン化',b:'皮・骨に多いコラーゲンが加熱で溶けてゼラチンになり、冷えると固まる。煮汁が翌日プルッと固まるのはこれ。'},
{g:'heat',t:'煮魚は落とし蓋で均一に染みる',b:'落とし蓋が煮汁を全体に回し、少ない煮汁でも味が均等に染み、身崩れも防ぐ。物理的に理にかなった道具。'},
{g:'heat',t:'煮魚は沸いた煮汁に入れる',b:'冷たい煮汁から加熱すると表面のタンパク質が溶け出し身崩れ・臭み移りが起きる。沸いた煮汁に入れると表面が即固まりうま味を閉じ込める。'},

/* ===== 料理：生食・寿司 ===== */
{g:'sushi',t:'寿司のシャリの酢は殺菌と保存',b:'江戸時代、酢飯は保存性を高め酸で細菌増殖を抑える実用から生まれた。うま味と酸味のバランスも計算されている。'},
{g:'sushi',t:'わさびには抗菌作用がある',b:'辛味成分アリルイソチオシアネートに抗菌・抗カビ効果。生魚に添える文化は理にかなう（ただしアニサキスは殺せない）。'},
{g:'sushi',t:'江戸前の“仕事”は冷蔵庫がない時代の知恵',b:'煮る・漬ける（ヅケ）・締める・昆布締めは鮮度保持とうま味増強を兼ねた保存技術。醤油漬けのヅケは殺菌＋味の浸透。'},
{g:'sushi',t:'白身は薄造り、赤身は厚切り',b:'白身は繊維が締まり歯ごたえが強いので薄く切って食感を和らげる。マグロなど赤身は柔らかいので厚めに切って食べ応えを出す。切り方が身質に合う。'},
{g:'sushi',t:'縁側が美味いのは動く筋肉だから',b:'ヒラメの縁側はヒレを動かす筋肉で運動量が多くコラーゲンと脂が豊富。コリコリした食感とうま味が凝縮する。'},
{g:'sushi',t:'「そぎ切り」で味が乗る',b:'繊維に対して斜めに包丁を入れると断面積が増え、醤油やタレとの接触面が広がって味が絡む。柔らかい白身の食感も和らぐ。'},
{g:'sushi',t:'刺身は引いて一方向で切る',b:'刃を手前に引いて切ると細胞をつぶさず断面がなめらかに。押し切りは細胞を潰しドリップと臭みが出やすい。切り口の美しさと味は包丁の動きで決まる。'},

/* ===== 料理：部位・食べ方 ===== */
{g:'part',t:'一番美味い部位は「トロ」＝腹の脂',b:'マグロの腹身は運動量が少なく不飽和脂肪酸が集中する。かつては傷みやすく捨てられていたが、冷蔵技術の普及で高級部位に昇格した。'},
{g:'part',t:'カマ・ほほ肉は隠れた美味',b:'エラ周りのカマは脂とゼラチン質、目の下のほほ肉はよく動く筋肉でうま味が濃い。歩留まりは悪いが味は濃厚。'},
{g:'part',t:'魚の皮はコラーゲンの宝庫',b:'皮と身の間にうま味と脂が集まる。皮を引かず炙る・湯引きするのは、その層を活かす調理。'},
{g:'part',t:'白子はオスの精巣',b:'タラ・フグの白子は繁殖期のオスにしかない季節限定部位。クリーミーなのは脂質とタンパク質が豊富だから。'},
{g:'part',t:'魚卵は加工で呼び名が変わる',b:'イクラ＝サケの成熟卵、筋子＝膜つき、たらこ＝スケトウダラの卵巣、明太子＝たらこの唐辛子漬け、カラスミ＝ボラの卵巣を塩漬け乾燥。すべて“卵”。'},
{g:'part',t:'青魚に大根おろしは消化と臭み消し',b:'大根の酵素と辛味成分が脂の重さを和らげ、TMA由来の臭みも抑える。焼き魚に大根おろしは食文化的にも科学的にも合理的。'},
{g:'part',t:'あぶりは脂を溶かし香りを立てる',b:'表面を炙ると脂が溶けて甘みと香ばしさ（メイラード）が出て、余分な臭みも飛ぶ。サーモン・のどぐろの炙りが人気の必然。'},

/* ===== 料理：出汁・保存・調味 ===== */
{g:'dashi',t:'かつお節・煮干しはイノシン酸の塊',b:'乾燥・発酵・燻製でうま味成分を凝縮する。かつお節はカビ付け（発酵）でさらにうま味と香りが増す、世界的にも珍しい保存食。'},
{g:'dashi',t:'干物が美味いのはうま味の濃縮',b:'干す過程で水分が抜けうま味が凝縮し、同時に酵素が働いてアミノ酸が増える。一夜干しが生より味が濃い理由。'},
{g:'dashi',t:'塩焼きの塩は味付けだけじゃない',b:'表面のタンパク質を固めて身崩れを防ぎ、余分な水分と臭みを引き出し、焼き色（メイラード）を促す。化粧塩はヒレを焦がさず見栄えを保つ実用。'},
{g:'dashi',t:'味噌漬け・粕漬けが日持ちする理由',b:'味噌・酒粕の塩分と発酵成分が水分活性を下げて細菌を抑え、同時に酵素がタンパク質を分解してうま味と柔らかさを増す。保存＋熟成の一石二鳥。'},
{g:'dashi',t:'急速冷凍はドリップが少ない',b:'氷結晶を小さく保ち細胞破壊を減らすので解凍後のうま味流出が少ない。ゆっくり冷凍すると大きな氷が細胞を壊しパサつく。'},

/* ===== 料理：技法・道具 ===== */
{g:'tech',t:'湯引き（皮霜造り）は皮のうま味を引き出す',b:'皮に熱湯をかけ即氷水で締めると皮下のコラーゲンがほどよく柔らかくなり、皮のうま味と身の生食感を同時に楽しめる。タイ・ハモの定番。'},
{g:'tech',t:'ハモの骨切りは物理的必然',b:'ハモは小骨が多く抜けないため、皮一枚を残して身と骨を細かく刻む。加熱で骨が縮み気にならなくなる。1寸に24筋が理想の職人技。'},
{g:'tech',t:'背開き・腹開きは料理で使い分け',b:'腹開きは内臓処理が楽で干物向き、背開きは見栄えがよく蒲焼き（関東のうなぎ）向き。関西は腹開きで蒸さず焼く。地域文化が捌き方に出る。'},
{g:'tech',t:'和包丁が片刃なのは断面のため',b:'片刃は刃が片側だけで、身に入れたとき断面がなめらかに“そげる”。刺身の透明感とツヤは片刃ならでは。洋包丁（両刃）とは用途が違う。'},
{g:'tech',t:'まな板は魚用を分けるのが衛生の基本',b:'生魚の細菌（腸炎ビブリオ等）が他の食材へ移る交差汚染を防ぐ。腸炎ビブリオは真水と低温に弱いので、真水で洗い冷蔵が有効。'},
{g:'tech',t:'炭酸水で衣を作るとサクサク',b:'炭酸ガスの気泡が加熱で膨張し、衣が軽く多孔質になる。天ぷら・フライをカラッと揚げる裏技の科学。'},
{g:'tech',t:'揚げ油の温度は泡と音で分かる',b:'衣を落として底まで沈んですぐ浮けば低温、途中で浮けば中温、表面で散れば高温。水分蒸発の勢い（泡）が温度計代わり。'},

/* ===== 料理：世界の魚料理・発酵 ===== */
{g:'world',t:'なれずしは寿司の原型で乳酸発酵',b:'魚を米に漬けて数か月〜数年発酵させ乳酸で保存する古代技法。滋賀の鮒寿司が現存例。酢飯の寿司はこの発酵を酢で“時短”したもの。'},
{g:'world',t:'魚醤はタンパク質分解のうま味',b:'魚を塩漬けにし自己消化酵素と微生物でアミノ酸へ分解。グルタミン酸豊富な液体調味料（ナンプラー・しょっつる）に。世界中に魚醤文化がある。'},
{g:'world',t:'セビーチェは“酸で締める”調理',b:'生魚をライム果汁に漬けると酸がタンパク質を変性させ、加熱と似た白濁・凝固が起きる。火を使わず“火が通ったような”食感になる中南米料理。'},
{g:'world',t:'グラブラックスは塩と砂糖の脱水熟成',b:'鮭を塩・砂糖・ハーブで漬け、浸透圧で脱水しながら熟成させる北欧料理。加熱せず保存性とうま味を得る。日本の塩締めと発想が同じ。'},
{g:'world',t:'かまぼこの弾力は“すり身の塩”',b:'白身魚のすり身に塩を加えて練ると筋原線維タンパク質が溶け出して網目構造を作り、加熱で弾力ある食感（足）になる。塩なしでは固まらない。'},
{g:'world',t:'シュールストレミングは缶内発酵',b:'世界一臭い缶詰。ニシンを缶の中で発酵させ続けるためガスで缶が膨張する。臭気は発酵で生じる酸・硫黄化合物。保存食が極端に進化した例。'},

/* ===== 料理：相性・組み合わせ ===== */
{g:'match',t:'魚に白ワインの理由（と例外）',b:'赤ワインの鉄分が魚の脂を酸化させ生臭さを強めるとされた。逆にタンニンの少ない赤や鉄分を抑えたワインなら青魚とも合う。組み合わせには化学的背景がある。'},
{g:'match',t:'青魚に生姜・梅・味噌が合う',b:'生姜のショウガオール、梅のクエン酸、味噌の発酵成分がいずれもTMA由来の臭みを抑える。イワシの梅煮・サバの味噌煮は理にかなった伝統食。'},
{g:'match',t:'脂の乗った魚に柑橘・大根おろし',b:'酸と辛味成分が脂の重さをリセットし後味を切る。焼き魚にすだち、揚げ物にレモンは味覚的にも消化的にも合理的。'},
{g:'match',t:'バターと魚（ムニエル）の相性',b:'小麦粉をまぶして焼くと表面が固まりうま味を閉じ込め、バターの脂溶性香気成分が魚の風味と溶け合う。焦がしバターはメイラードで香ばしさ倍増。'},

/* ===== 料理：失敗の原因と対策 ===== */
{g:'fail',t:'煮魚が生臭い最大原因は下処理不足',b:'霜降り・血合い除去を怠ると血液とぬめりの臭みが煮汁に移る。臭みは“加熱で消える”より“入れない”のが正解。'},
{g:'fail',t:'焼き魚がパサつくのは焼きすぎと塩',b:'早く塩を打ちすぎると水分が抜けすぎる。焼く直前〜適度前に塩を打ち、火を通しすぎないのがしっとりのコツ。'},
{g:'fail',t:'刺身が水っぽいのは切り置き',b:'切った断面から時間とともにドリップ（うま味を含む水分）が出る。直前に切る、キンキンに冷やすが鉄則。'},
{g:'fail',t:'揚げ物がベチャつくのは油温低下',b:'一度に大量投入すると油温が下がり衣が水分を放出しきれず油を吸う。少量ずつ・温度キープが多孔質サクサクの条件。'},
{g:'fail',t:'皮が縮んで反るのは加熱ムラ',b:'皮と身の収縮率が違うため。皮に浅く切れ目を入れる（隠し包丁）か、ヘラで軽く押さえると平らに焼ける。'},
{g:'fail',t:'身がボロボロ崩れるのは触りすぎ',b:'加熱途中で何度も動かすと固まる前のタンパク質がちぎれる。片面がしっかり焼けて自然に剥がれるまで待つ。'},
{g:'fail',t:'冷凍魚がまずいのはドリップ流出',b:'急に高温解凍すると細胞外に水分が出てうま味が逃げる。冷蔵庫でゆっくり、または氷水・塩水解凍がドリップを抑える。'},

/* ===== 料理：栄養・健康・安全 ===== */
{g:'health',t:'青魚の脂が体に良いのはEPA・DHA',b:'冷たい海でも体が固まらないよう魚は不飽和脂肪酸（オメガ3）を多く蓄える。人には血中脂質改善・抗炎症に働くとされる。'},
{g:'health',t:'青魚の脂は加熱で一部失われる',b:'EPA・DHAは酸化・流出しやすい。刺身や軽い加熱の方が効率よく摂れる。焼くなら脂を落としすぎないのがコツ。'},
{g:'health',t:'カルシウムは骨ごと食べる小魚が効率的',b:'しらす・煮干し・骨まで食べる調理が源。酢で煮ると酸がカルシウムを溶かし出し、骨が柔らかくなって吸収も助ける。'},
{g:'health',t:'貝の砂抜きは塩水で生息環境を再現',b:'海水と同程度（約3%）の塩水に浸けると貝が呼吸して砂を吐く。暗く静かにするとより効果的。真水では弱って吐かない。'},
{g:'health',t:'牡蠣は“R”のつく月が旬（西洋）',b:'綴りにRを含まない5〜8月（May〜August）は産卵期で身が痩せ食中毒リスクも上がるという経験則。真牡蠣は冬が旬。'},

/* 番号を全体で振る */
T.forEach((x,i)=>x.no=i+1);

/* ============================================================
   描画
============================================================ */
const $=s=>document.querySelector(s);
const listEl=$('#list');
const countEl=$('#count');
let curGenre='all', kw='';

/* --- フィルタチップ --- */
function drawFilters(){
  const box=$('#filters');
  const counts={};
  T.forEach(x=>counts[x.g]=(counts[x.g]||0)+1);
  let html=`<button class="f-btn" data-g="all" aria-pressed="true">すべて<span class="n">${T.length}</span></button>`;
  Object.keys(GENRES).forEach(g=>{
    if(!counts[g])return;
    html+=`<button class="f-btn" data-g="${g}" aria-pressed="false">${GENRES[g].label}<span class="n">${counts[g]}</span></button>`;
  });
  box.innerHTML=html;
  box.querySelectorAll('.f-btn').forEach(b=>b.onclick=()=>{
    curGenre=b.dataset.g;
    box.querySelectorAll('.f-btn').forEach(x=>x.setAttribute('aria-pressed', x===b));
    draw();
  });
}

/* --- 検索ハイライト --- */
function hl(text){
  if(!kw)return esc(text);
  const re=new RegExp('('+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return esc(text).replace(re,'<mark>$1</mark>');
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* --- リスト描画 --- */
function draw(){
  let hit=T.filter(x=>
    (curGenre==='all'||x.g===curGenre) &&
    (!kw||x.t.includes(kw)||x.b.includes(kw))
  );
  countEl.textContent=hit.length+' / '+T.length+' 件';

  if(!hit.length){
    listEl.innerHTML=`<div class="empty"><div class="big">見つかりませんでした</div>別のキーワードで探すか、フィルタを「すべて」に戻してください。</div>`;
    return;
  }

  // ジャンル別にグループ化して見出しつきで並べる
  let html='',lastG='';
  hit.forEach(x=>{
    if(x.g!==lastG){
      if(lastG!=='')html+='</div>';
      html+=`<div class="grp-head">${GENRES[x.g].label}</div><div class="tlist">`;
      lastG=x.g;
    }
    html+=`<div class="tcard">
      <div class="th"><span class="tnum">${String(x.no).padStart(3,'0')}</span><h4 class="tt">${hl(x.t)}</h4></div>
      <p class="tb">${hl(x.b)}</p>
    </div>`;
  });
  html+='</div>';
  listEl.innerHTML=html;
}

/* --- ランダム今日の一問 --- */
function spotlight(){
  const x=T[Math.floor(Math.random()*T.length)];
  $('#spotlight').hidden=false;
  $('#sp-genre').textContent=GENRES[x.g].label;
  $('#sp-title').textContent=x.t;
  $('#sp-body').textContent=x.b;
  // スクロールは検索中は邪魔なのでしない
}

/* --- events --- */
$('#q').addEventListener('input',e=>{kw=e.target.value.trim();draw();});
$('#shuffle').onclick=()=>{ spotlight(); window.scrollTo({top:0,behavior:'smooth'}); };
$('#sp-again').onclick=spotlight;

drawFilters();
draw();
spotlight();
